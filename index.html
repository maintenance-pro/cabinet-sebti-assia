const COLL_OK = c => c === "patients" || c === "config" || /^mois\/\d{4}-\d{2}\/(rdv|paiements|charges)$/.test(c);
const loadScript = src => new Promise((ok, ko) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = () => ko(new Error("Chargement impossible : " + src)); document.head.appendChild(s); });

async function importToCloud(data, onStep){
  const ops = [];
  for (const [c, docs] of Object.entries(data || {})) if (COLL_OK(c) && docs && typeof docs === "object") for (const [id, d] of Object.entries(docs)) ops.push([c, id, d]);
  for (let i = 0; i < ops.length; i += 400){ // une écriture groupée Firestore accepte 500 opérations au plus
    const b = S.db.batch();
    ops.slice(i, i + 400).forEach(([c, id, d]) => b.set(S.db.collection(c).doc(id), d));
    await b.commit(); onStep && onStep(Math.min(i + 400, ops.length), ops.length);
  }
}
async function dumpCloud(){
  const out = {};
  const put = (c, snap) => { if (!snap.empty){ out[c] = {}; snap.docs.forEach(d => { out[c][d.id] = d.data(); }); } };
  put("patients", await S.db.collection("patients").get());
  put("config", await S.db.collection("config").get());
  // Firestore ne liste pas les mois existants : on parcourt de la plus ancienne date connue à +12 mois
  let first = addMonths(monthOf(TODAY), -12);
  const take = s => { const m = monthOf(s); if (/^\d{4}-\d{2}$/.test(m) && m < first) first = m; };
  Object.values(out.patients || {}).forEach(p => { take(p.createdAt); take(p.dateOrdonnance); });
  const c = (out.config && out.config.cabinet) || {};
  (c.chargesFixes || []).forEach(f => take(f.depuis)); (c.materiel || []).forEach(x => take(x.achat));
  const tasks = [];
  for (let m = first, end = addMonths(monthOf(TODAY), 12); m <= end; m = addMonths(m, 1))
    ["rdv","paiements","charges"].forEach(k => { const p = `mois/${m}/${k}`; tasks.push(async () => put(p, await S.db.collection(p).get())); });
  await pool(tasks, 6);
  return out;
}
async function exportData(){
  if (!S.db) return;
  toast("Préparation de la sauvegarde…");
  let data;
  try { data = await dumpCloud(); } catch(e){ writeError(e); return; }
  const payload = {app:"cabinet-sebti-assia", version:1, exportedAt:new Date().toISOString(), data};
  const blob = new Blob([JSON.stringify(payload, null, 1)], {type:"application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `sauvegarde-cabinet-sebti-assia-${TODAY}.json`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  toast("Sauvegarde téléchargée. Range-la hors de l'ordinateur (clé USB, Drive).");
}
function readImportFile(file){
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const p = JSON.parse(fr.result);
      if (!p || p.app !== "cabinet-sebti-assia" || !p.data || typeof p.data !== "object") throw new Error("format");
      const keys = Object.keys(p.data);
      const nPat = Object.keys(p.data.patients || {}).length;
      const nRdv = keys.filter(k => /^mois\/\d{4}-\d{2}\/rdv$/.test(k)).reduce((s, k) => s + Object.keys(p.data[k]).length, 0);
      S.pendingImport = {data:p.data, name:file.name, nPat, nRdv, date:p.exportedAt};
    } catch(e){ S.pendingImport = null; toast("Ce fichier n'est pas une sauvegarde du cabinet.", true); }
    S.shellKey = ""; schedule();
  };
  fr.onerror = () => toast("Lecture du fichier impossible.", true);
  fr.readAsText(file);
}
function backupSection(){
  if (S.mode !== "firebase") return "";
  const pi = S.pendingImport;
  return `<section class="box" style="margin-top:14px"><h3>Données et compte</h3>
    <p class="hint">Les données sont enregistrées en ligne, dans la base Firebase du cabinet (en Europe, protégée contre la suppression). Elles sont disponibles sur tout appareil connecté avec ${esc(COMPTES.join(" ou "))}.</p>
    <p class="hint" style="margin-top:6px">Connecté : <b>${esc(S.fbUser ? S.fbUser.email : "")}</b>. Télécharger une copie de temps en temps (clé USB, Drive) reste une bonne précaution.</p>
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:12px">
      <button type="button" class="btn" data-action="export">Télécharger une sauvegarde</button>
      <label class="btn" for="importFile" data-write>Importer une sauvegarde…</label><input type="file" id="importFile" accept=".json,application/json" hidden>
      <button type="button" class="btn ghost" data-action="logout">Se déconnecter</button>
    </div>
    ${pi ? `<div class="banner warn" style="margin:12px 0 0"><span>« ${esc(pi.name)} » : ${pi.nPat} patients, ${pi.nRdv} rendez-vous${pi.date ? ", sauvegardé le " + esc(new Date(pi.date).toLocaleDateString("fr-FR")) : ""}. L'import ajoute ces éléments à la base en ligne ; ceux qui y sont déjà sont remplacés par la version de la sauvegarde.</span>
      <span style="display:flex;gap:6px"><button type="button" class="btn sm" data-action="import-cancel">Annuler</button><button type="button" class="btn sm primary" data-action="import-confirm" data-confirm data-write>Importer</button></span></div>` : ""}
  </section>`;
}

/* ================= Ancienne version (données du navigateur) ================= */
// Avant Firebase, les données restaient dans le navigateur. On propose une fois de les envoyer en ligne ;
// elles ne sont jamais effacées du navigateur.
const LS_KEY = "cabinet-sebti-assia:data:v1", LS_LEGACY = "cabinet-sebti-assia:ancienne-version";
function readLegacy(){
  try {
    if (localStorage.getItem(LS_LEGACY)) return null;
    const data = JSON.parse(localStorage.getItem(LS_KEY) || "null");
    if (!data || typeof data !== "object") return null;
    const nPat = Object.keys(data.patients || {}).length;
    const nRdv = Object.keys(data).filter(k => /^mois\/\d{4}-\d{2}\/rdv$/.test(k)).reduce((s, k) => s + Object.keys(data[k] || {}).length, 0);
    return nPat || nRdv ? {data, nPat, nRdv} : null;
  } catch(e){ return null; }
}
function legacyDone(how){ S.legacy = null; try { localStorage.setItem(LS_LEGACY, how + " " + new Date().toISOString()); } catch(e){} }

/* ================= Connexion ================= */
const AUTH_OFF = "La connexion par e-mail n'est pas encore activée dans la console Firebase (Authentication › Sign-in method › E-mail/Mot de passe).";
const AUTH_ERR = {
  "auth/invalid-credential":"E-mail ou mot de passe incorrect.", "auth/wrong-password":"E-mail ou mot de passe incorrect.",
  "auth/user-not-found":"Aucun compte avec cet e-mail : utilise « Première fois : créer le compte ».",
  "auth/invalid-email":"Adresse e-mail invalide.", "auth/missing-password":"Saisis le mot de passe.",
  "auth/too-many-requests":"Trop d'essais. Attends quelques minutes ou réinitialise le mot de passe.",
  "auth/network-request-failed":"Pas de connexion internet. Vérifie le réseau puis réessaie.",
  "auth/email-already-in-use":"Ce compte existe déjà : connecte-toi avec son mot de passe.",
  "auth/weak-password":"Mot de passe trop court : 8 caractères minimum.",
  "auth/operation-not-allowed":AUTH_OFF, "auth/configuration-not-found":AUTH_OFF
};
const authMsg = e => AUTH_ERR[e && e.code] || `Connexion impossible (${(e && e.code) || "erreur inconnue"}).`;

function showGate(step, err){
  S.gate = step;
  const g = $("#gate"), body = $("#gateBody");
  if (!step){ g.hidden = true; return; }
  g.hidden = false;
  const u = S.fbAuth && S.fbAuth.currentUser;
  const mail = `<label class="f">E-mail<input id="gMail" type="email" autocomplete="username" value="${esc(u ? u.email : COMPTES[0])}"></label>`;
  const errHtml = err ? `<p class="err" role="alert">${esc(err)}</p>` : "";
  const H = {
    loading: `<p class="hint">Connexion à la base du cabinet…</p>`,
    offline: `<h2>Base en ligne injoignable</h2><p class="hint">Vérifie la connexion internet puis recharge la page.</p>
      <button type="button" class="btn primary" data-action="reload">Recharger</button>`,
    login: `<h2>Connexion</h2>${mail}
      <label class="f">Mot de passe<input id="gPass" type="password" autocomplete="current-password"></label>${errHtml}
      <button type="submit" class="btn primary">Se connecter</button>
      <div class="gate-links"><button type="button" class="linkbtn" data-action="gate-step" data-step="reset">Mot de passe oublié ?</button>
      <button type="button" class="linkbtn" data-action="gate-step" data-step="create">Première fois : créer le compte</button></div>`,
    create: `<h2>Créer le compte du cabinet</h2>${mail}
      <label class="f">Mot de passe (8 caractères minimum)<input id="gPass" type="password" autocomplete="new-password"></label>
      <label class="f">Confirmer le mot de passe<input id="gPass2" type="password" autocomplete="new-password"></label>${errHtml}
      <button type="submit" class="btn primary">Créer le compte</button>
      <div class="gate-links"><button type="button" class="linkbtn" data-action="gate-step" data-step="login">J'ai déjà un compte</button></div>`,
    reset: `<h2>Mot de passe oublié</h2><p class="hint">Un lien pour choisir un nouveau mot de passe sera envoyé à cette adresse.</p>${mail}${errHtml}
      <button type="submit" class="btn primary">Envoyer le lien</button>
      <div class="gate-links"><button type="button" class="linkbtn" data-action="gate-step" data-step="login">Retour à la connexion</button></div>`,
    verify: `<h2>Confirme l'adresse e-mail</h2><p class="hint">Un lien de confirmation a été envoyé à <b>${esc(u ? u.email : "")}</b>. Ouvre la boîte mail (regarde aussi dans les spams), clique sur le lien, puis reviens ici.</p>${errHtml}
      <button type="button" class="btn primary" data-action="gate-verified">J'ai cliqué sur le lien</button>
      <div class="gate-links"><button type="button" class="linkbtn" data-action="gate-resend">Renvoyer l'e-mail</button>
      <button type="button" class="linkbtn" data-action="logout">Se déconnecter</button></div>`,
    denied: `<h2>Accès non autorisé</h2><p class="hint">Le compte <b>${esc(u ? u.email : "")}</b> n'a pas accès aux données du cabinet. Connecte-toi avec ${esc(COMPTES.join(" ou "))}.</p>
      <button type="button" class="btn primary" data-action="logout">Changer de compte</button>`
  };
  body.innerHTML = H[step] || "";
  const f = $("#gPass", body) || $("#gMail", body); if (f) f.focus();
}
async function gateSubmit(){
  const step = S.gate, a = S.fbAuth; if (!a || !["login","create","reset"].includes(step)) return;
  const mail = ($("#gMail") ? $("#gMail").value : "").trim().toLowerCase(), pass = $("#gPass") ? $("#gPass").value : "";
  const fail = msg => { showGate(step, msg); $("#gMail").value = mail; };
  if (!mail) return fail("Saisis l'adresse e-mail.");
  if (step !== "reset" && !COMPTES.includes(mail)) return fail(`Seul ${COMPTES.join(" ou ")} a accès aux données du cabinet.`);
  if (step === "create"){
    if (pass.length < 8) return fail("Mot de passe trop court : 8 caractères minimum.");
    if (pass !== $("#gPass2").value) return fail("Les deux mots de passe ne sont pas identiques.");
  }
  $("#fLogin button[type=submit]").disabled = true;
  try {
    if (step === "login") await a.signInWithEmailAndPassword(mail, pass);
    else if (step === "create") await a.createUserWithEmailAndPassword(mail, pass); // l'e-mail de confirmation part depuis onAuth
    else { await a.sendPasswordResetEmail(mail); showGate("login"); toast(`Lien envoyé à ${mail}. Regarde aussi dans les spams.`); }
  } catch(e){ console.error(e); fail(authMsg(e)); }
}
async function gateVerified(btn){
  const a = S.fbAuth; if (!a.currentUser) return showGate("login");
  btn.disabled = true;
  try { await a.currentUser.reload(); } catch(e){ return showGate("verify", authMsg(e)); }
  const u = a.currentUser;
  if (!u.emailVerified) return showGate("verify", "L'adresse n'est pas encore confirmée. Clique sur le lien reçu par e-mail, puis réessaie.");
  await onAuth(u);
}
async function gateResend(btn){
  const u = S.fbAuth.currentUser; if (!u) return;
  btn.disabled = true;
  try { await u.sendEmailVerification(); toast(`E-mail renvoyé à ${u.email}.`); btn.disabled = false; }
  catch(e){ showGate("verify", authMsg(e)); }
}
async function onAuth(u){
  S.fbUser = null;
  if (!u){ if (S.started) location.reload(); else showGate("login"); return; }
  if (!COMPTES.includes(String(u.email || "").toLowerCase())) return showGate("denied");
  if (!u.emailVerified){
    if (!S.verifySent){ S.verifySent = true; u.sendEmailVerification().catch(e => console.error(e)); }
    return showGate("verify");
  }
  // les règles de la base lisent email_verified dans le jeton : on le renouvelle s'il date d'avant la confirmation
  try { const t = await u.getIdTokenResult(); if (!t.claims.email_verified) await u.getIdToken(true); } catch(e){ console.warn(e); }
  S.fbUser = u; S.navKey = ""; showGate(null);
  if (!S.started) start(S.fdb);
  schedule();
}
async function logout(){
  if (S.db && S.db.waitForPendingWrites){
    const r = await Promise.race([S.db.waitForPendingWrites().then(() => "ok"), new Promise(r => setTimeout(() => r("pending"), 4000))]);
    if (r === "pending"){ toast("Des modifications attendent encore la connexion internet : déconnexion annulée pour ne pas les perdre.", true); return; }
    // le cache hors ligne contient des dossiers patients : on le vide en quittant
    S.leaving = true;
    try { await S.db.terminate(); await S.db.clearPersistence(); } catch(e){ console.warn(e); }
  }
  try { await S.fbAuth.signOut(); } catch(e){ console.error(e); }
  location.reload();
}

/* ================= Démarrage ================= */
(async function init(){
  readHash(); render();
  const cl = window.claude;
  if (cl && typeof cl.use === "function"){
    let db = null, user = null;
    try { [db, user] = await Promise.all([cl.use("db"), cl.use("user")]); } catch(e){ console.error(e); }
    S.user = user;
    if (user){ try { S.canWrite = await user.can("data.write"); } catch(e){} if (S.canWrite === false) S.readonly = true; }
    if (!db){ S.status = "nodb"; render(); return; }
    start(db); return;
  }
  // Site du cabinet : base Firebase, après connexion du compte autorisé
  S.mode = "firebase"; S.canWrite = true;
  showGate("loading");
  try { for (const src of FB_SDK) await loadScript(src); }
  catch(e){ console.error(e); showGate("offline"); return; }
  firebase.initializeApp(FIREBASE_CONFIG);
  S.fdb = firebase.firestore();
  S.fdb.settings({ignoreUndefinedProperties:true});
  try { await S.fdb.enablePersistence({synchronizeTabs:true}); } // cache hors ligne : l'agenda reste lisible sans internet
  catch(e){ console.warn("Cache hors ligne indisponible :", e.code || e); }
  S.legacy = readLegacy();
  S.fbAuth = firebase.auth();
  S.fbAuth.onAuthStateChanged(u => { onAuth(u).catch(e => { console.error(e); showGate("login", authMsg(e)); }); });
})();
function start(db){
  S.db = db; S.started = true;
  S.loadTimer = setTimeout(() => { if (S.status === "loading"){ S.status = "slow"; S.patientsReady = true; schedule(); } }, 10000);
  try{
    watch(db.collection("patients"), snap => {
      const map = new Map(); snap.docs.forEach(d => map.set(d.id, d.data())); S.patients = map;
      if (!snap.metadata.fromCache) S.patientsReady = true;
      markFresh(snap.metadata.fromCache); schedule();
    });
    watch(db.doc("config/cabinet"), snap => { S.config = snap.exists ? snap.data() : null; schedule(); });
  }catch(e){ console.error(e); }
  baseWindow().forEach(ensureMonth);
}
</script>
