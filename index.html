<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cabinet Sebti Assia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Kufi+Arabic:wght@600;700&family=Public+Sans:wght@400;500;600;700&family=Roboto+Condensed:wght@500;700&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cpath d='M17 42.5C7.5 39.5 2.6 30.5 5 21.5 7.6 11.6 18 5.2 29 5.6c6.8.3 12.3 3.3 14.6 8.4' fill='none' stroke='%23A8368B' stroke-width='3.4' stroke-linecap='round'/%3E%3Ccircle cx='32.5' cy='11.5' r='4.2' fill='%232F4F91'/%3E%3Cpath d='M29 18.5L21.5 28.5' stroke='%2313826D' stroke-width='5.6' stroke-linecap='round'/%3E%3Cpath d='M28 19.5L33.5 24.5 39 21.5M28 19.5L21.5 17.5 17.5 21.5M21.5 28.5L15.5 35.5 9.5 34.5' stroke='%232F4F91' stroke-width='3.8' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3Cpath d='M21.5 28.5L30 32.5 30.5 41' stroke='%2313826D' stroke-width='4.4' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E">
<style>
/* Layout : rail de navigation à gauche + plan de travail ; barre d'onglets en bas sur téléphone.
   Identité reprise de la carte de visite : vert d'eau pour l'action, magenta « Sebti Assia » réservé au repère
   « aujourd'hui / hors ordonnance », bleu marine pour le texte ; titres en capitales condensées comme sur la carte. */
:root{
  --bg:#F4F6F9; --surface:#FFFFFF; --sunken:#EDF1F5; --ink:#1B2F4E; --ink-2:#3B4F6E; --muted:#5F6E85;
  --line:#DAE1E9; --line-strong:#B9C4D2; --grid:#E5EAF0;
  --accent:#13826D; --accent-ink:#0D6858; --accent-soft:#DCF1EA; --on-accent:#FFFFFF;
  --tape:#A8368B; --tape-soft:#F8E4F2; --logo-blue:#2F4F91;
  --good:#2E7A2C; --good-soft:#E3F1DF; --warn:#935D00; --warn-soft:#FAEED3; --bad:#B3352E; --bad-soft:#F8E1DF;
  --chart-a:#1A9580; --chart-b:#3E5C9A;
  --scrim:rgba(10,20,38,.45); --shadow:0 1px 2px rgba(27,47,78,.06),0 12px 32px rgba(27,47,78,.14);
  --f-display:"Roboto Condensed","Arial Narrow","Segoe UI",system-ui,sans-serif;
  --f-body:"Public Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --f-ar:"Noto Kufi Arabic","Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1522; --surface:#132033; --sunken:#0F1A2A; --ink:#E3E9F2; --ink-2:#B3BFD1; --muted:#8492A8;
  --line:#22314A; --line-strong:#33445F; --grid:#1B283B;
  --accent:#45C2A8; --accent-ink:#7DD6C3; --accent-soft:#103A36; --on-accent:#03241E;
  --tape:#E57CC8; --tape-soft:#3A1733; --logo-blue:#7F9BDB;
  --good:#74C66A; --good-soft:#16301A; --warn:#E5AE45; --warn-soft:#33270E; --bad:#F07D74; --bad-soft:#3C1A17;
  --chart-a:#2FAF95; --chart-b:#6F8DD0;
  --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.45);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0C1522; --surface:#132033; --sunken:#0F1A2A; --ink:#E3E9F2; --ink-2:#B3BFD1; --muted:#8492A8;
  --line:#22314A; --line-strong:#33445F; --grid:#1B283B;
  --accent:#45C2A8; --accent-ink:#7DD6C3; --accent-soft:#103A36; --on-accent:#03241E;
  --tape:#E57CC8; --tape-soft:#3A1733; --logo-blue:#7F9BDB;
  --good:#74C66A; --good-soft:#16301A; --warn:#E5AE45; --warn-soft:#33270E; --bad:#F07D74; --bad-soft:#3C1A17;
  --chart-a:#2FAF95; --chart-b:#6F8DD0;
  --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{text-wrap:balance}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{text-align:right;white-space:nowrap}
.muted{color:var(--muted)}
.ro [data-write]{display:none!important}

.app{display:grid;grid-template-columns:212px minmax(0,1fr);gap:32px;max-width:1440px;margin:0 auto;min-height:100vh;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
.rail{position:sticky;top:0;align-self:start;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:26px;padding-block:26px}
.brand{display:flex;flex-direction:column;gap:8px}
.brand-row{display:flex;gap:9px;align-items:center}
.brand svg{width:44px;height:44px;flex:none}
.brand small{display:block;font-family:var(--f-display);font-weight:700;font-size:10.5px;line-height:1.2;letter-spacing:.04em;text-transform:uppercase;color:var(--accent-ink)}
.brand b{display:block;font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1.05;letter-spacing:.01em;text-transform:uppercase;color:var(--tape);margin-top:2px}
.ar{font-family:var(--f-ar);font-weight:700}
.brand .ar{font-size:11.5px;line-height:1.6;color:var(--accent-ink);padding-top:7px;border-top:1px solid var(--tape)}
.brand .ar b{display:inline;font:inherit;text-transform:none;letter-spacing:0;color:var(--tape);margin:0}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:8px;color:var(--ink-2);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--sunken)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.nav svg{width:18px;height:18px;flex:none}
.rail-foot{margin-top:auto;color:var(--muted);font-size:12px;line-height:1.5;display:flex;flex-direction:column;gap:10px}
.contact{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px;color:var(--ink-2)}
.contact li{display:flex;gap:8px;align-items:flex-start;min-width:0}
.contact svg{width:16px;height:16px;flex:none;color:var(--accent);margin-top:1px}
.contact a{color:inherit;text-decoration:none;overflow-wrap:anywhere}
.contact a:hover{color:var(--accent-ink);text-decoration:underline}
.contact .tel{font-family:var(--f-display);font-weight:700;font-size:14px;letter-spacing:.03em;line-height:1.3}
.main{min-width:0;padding-block:26px 56px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;margin-bottom:18px}
.top h1{font-family:var(--f-display);font-weight:700;font-size:32px;line-height:1.1;margin:0}
.top p{margin:4px 0 0;color:var(--muted)}
.mbrand{display:none}
.tabbar{display:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);padding:7px 12px;border-radius:8px;font-weight:600;font-size:13.5px;cursor:pointer;min-height:36px;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--ink-2)}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--sunken)}
.btn.sm{padding:4px 9px;min-height:30px;font-size:12.5px}
.btn.ok{border-color:var(--good);color:var(--good)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.armed{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.icon-btn{width:36px;padding:0}

.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--sunken);color:var(--ink-2);white-space:nowrap;line-height:1.5}
.chip svg{width:12px;height:12px}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.accent{background:var(--accent-soft);color:var(--accent-ink)}
.chip.tape{background:var(--tape-soft);color:var(--tape)}
.chip.ex{background:transparent;border:1px dashed var(--line-strong);color:var(--muted);font-weight:500}

.banner{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;padding:10px 14px;border-radius:10px;margin-bottom:12px;font-size:13.5px;border:1px solid var(--line)}
.banner.info{background:var(--accent-soft);border-color:transparent;color:var(--accent-ink)}
.banner.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.banner.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}

.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.box h3,.lbl{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:600}
.box h3{display:flex;justify-content:space-between;align-items:center;gap:8px}
.stack{display:flex;flex-direction:column;gap:14px}
.hint{color:var(--muted);font-size:12.5px;margin:0}
.empty{padding:22px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}

/* ---------- Agenda ---------- */
.daybar{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch;margin-bottom:12px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;flex:1 1 420px;min-width:0}
.wd{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 2px 5px;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:0;min-width:0}
.wd .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.wd .n{font-family:var(--f-display);font-weight:700;font-size:19px;line-height:1.15}
.wd .c{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.wd:hover{border-color:var(--line-strong)}
.wd[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.wd[aria-pressed="true"] .c{color:var(--accent-ink)}
.wd.today .n{color:var(--tape)}
.wd.closed{opacity:.55}
.navpair{display:flex;gap:4px;align-items:stretch}
.stats{display:flex;flex-wrap:wrap;gap:6px 22px;padding:10px 16px;background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:14px}
.stats div{display:flex;flex-direction:column}
.stats span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.stats b{font-family:var(--f-mono);font-size:16px;font-weight:500;font-variant-numeric:tabular-nums}
.ag{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
.tl{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tl-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.slot{display:grid;grid-template-columns:62px minmax(0,1fr);border-top:1px solid var(--grid)}
.tl-head + .slot{border-top:0}
.slot>time{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);padding:12px 0 0 14px}
.slot.now>time{color:var(--tape);font-weight:500}
.slot.now{box-shadow:inset 3px 0 0 var(--tape)}
.cards{display:grid;grid-template-columns:repeat(var(--postes,3),minmax(0,1fr));gap:6px;padding:6px 8px 6px 0;min-width:0}
.add{border:1px dashed var(--line-strong);border-radius:8px;background:transparent;color:var(--muted);min-height:40px;cursor:pointer;font-size:12.5px}
.add:hover{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft)}
.rdv{border:1px solid var(--line);border-radius:9px;padding:7px 9px 8px;background:var(--surface);display:flex;flex-direction:column;gap:3px;min-width:0}
.rdv.s-effectue{background:var(--sunken)}
.rdv.s-annule{opacity:.55}
.rdv.s-annule .nm{text-decoration:line-through}
.rdv.hors{border:1.5px dashed var(--tape)}
.rh{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.rh .t{font-family:var(--f-mono);font-size:12px;color:var(--ink-2)}
.sn{font-family:var(--f-mono);font-size:11px;padding:0 5px;border:1px solid var(--line-strong);border-radius:4px;color:var(--ink-2)}
.rh .chip.st{margin-left:auto}
.nm{all:unset;cursor:pointer;font-weight:600;font-size:14px;overflow-wrap:anywhere}
.nm:hover{color:var(--accent-ink);text-decoration:underline}
.nm:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.mt{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.hw{font-size:11.5px;font-weight:600;color:var(--tape)}
.ra{display:flex;flex-wrap:wrap;gap:5px;margin-top:3px}
.alist{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.alist li{display:flex;flex-direction:column;gap:3px;padding-bottom:8px;border-bottom:1px solid var(--grid)}
.alist li:last-child{border-bottom:0;padding-bottom:0}
.alist .r1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.alist .r2{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)}
.linkish{all:unset;cursor:pointer;font-weight:600}
.linkish:hover{text-decoration:underline;color:var(--accent-ink)}
.linkish:focus-visible{outline:2px solid var(--accent);border-radius:3px}

/* ---------- Patients ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.search{flex:1 1 240px;min-width:0;position:relative}
.search input{width:100%;padding-left:34px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--surface);padding:7px 11px;cursor:pointer;font-weight:500;font-size:13px;color:var(--ink-2)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.plist{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.phead,.prow{display:grid;grid-template-columns:minmax(0,2.1fr) minmax(0,1.3fr) minmax(0,1fr) minmax(0,1.2fr);gap:14px;align-items:center;padding:11px 16px}
.phead{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);border-bottom:1px solid var(--line);font-weight:600}
.prow{width:100%;border:0;border-top:1px solid var(--grid);background:transparent;text-align:left;cursor:pointer}
.prow:first-of-type{border-top:0}
.prow:hover{background:var(--sunken)}
.pn{display:flex;flex-direction:column;gap:2px;min-width:0}
.pn b{font-size:14.5px;overflow-wrap:anywhere}
.pn small{color:var(--muted);font-size:12.5px;overflow-wrap:anywhere}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.prog{display:flex;flex-direction:column;gap:4px;min-width:0}
.bar{height:7px;border-radius:4px;background:var(--grid);display:flex;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.bar i.plan{background:var(--accent);opacity:.35}
.bar i.over{background:var(--tape)}
.prog span{font-size:12px;color:var(--muted)}
.solde{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.solde b{font-family:var(--f-mono);font-weight:500;font-variant-numeric:tabular-nums}

/* ---------- Tables / argent ---------- */
.mnav{display:inline-flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:3px}
.mnav strong{min-width:150px;text-align:center;font-weight:600;text-transform:capitalize}
.mnav .btn{min-height:30px;width:32px;padding:0;border-color:transparent}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--grid);vertical-align:middle}
tr:last-child td{border-bottom:0}
th.num{text-align:right}
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 15px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi span{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.kpi b{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.2;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi small{font-size:12px;color:var(--muted)}
.kpi.hero{grid-column:span 2;background:var(--accent-soft);border-color:transparent}
.kpi.hero b{font-size:34px}
.kpi.hero.neg{background:var(--bad-soft)}
.kpi.hero.neg b{color:var(--bad)}
.kpi.hero.pos b{color:var(--accent-ink)}
.kpis.k6{grid-template-columns:repeat(6,minmax(0,1fr))}
.modes-bars{display:flex;flex-direction:column;gap:8px}
.mb{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px}
.mb .bar{height:10px}
.pl td:first-child{padding-left:4px}
.pl tr.sec td{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;padding-top:14px;border-bottom:1px solid var(--line)}
.pl tr.tot td{font-weight:700;border-top:1px solid var(--line-strong)}
.pl tr.res td{font-family:var(--f-display);font-weight:700;font-size:17px;border-top:2px solid var(--ink)}
.pl td.ind{padding-left:18px}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto}
.chart .gl{stroke:var(--grid);stroke-width:1}
.chart .base{stroke:var(--line-strong);stroke-width:1}
.chart .ax{fill:var(--muted);font-family:var(--f-mono);font-size:11px}
.chart .ml{fill:var(--ink-2);font-size:12px;font-family:var(--f-body);font-weight:600}
.chart .rl{fill:var(--ink);font-family:var(--f-mono);font-size:11.5px}
.chart .bar-a{fill:var(--chart-a)}
.chart .bar-b{fill:var(--chart-b)}
.chart .hit{fill:transparent;cursor:default}
.chart .hit:hover,.chart .hit:focus{fill:var(--accent);fill-opacity:.07;outline:none}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--ink-2);margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:7px 9px;border-radius:7px;line-height:1.45;white-space:nowrap;z-index:5;font-variant-numeric:tabular-nums}
details.tblv summary{cursor:pointer;color:var(--accent-ink);font-size:13px;font-weight:600;margin-top:8px}
.ind-list{display:flex;flex-direction:column;gap:10px;margin:0}
.ind-list div{display:flex;justify-content:space-between;gap:10px;align-items:baseline;border-bottom:1px solid var(--grid);padding-bottom:8px}
.ind-list div:last-child{border-bottom:0}
.ind-list dt{color:var(--ink-2)}
.ind-list dd{margin:0;font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}

const DEFAULTS = {
  nom:"Cabinet de kinésithérapie Sebti Assia", praticien:"Sebti Assia",
  telFixe:"05 21 33 31 30", telMobile:"06 01 97 68 67", email:"cabinetkinesebti@gmail.com",

};
const ROUTES = ["agenda","patients","caisse","charges","resultat","reglages"];
const TITLES = {agenda:"Agenda", patients:"Patients", caisse:"Caisse", charges:"Charges", resultat:"Résultat", reglages:"Réglages"};

/* ================= Utilitaires ================= */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y,m,d] = String(s).split("-").map(Number); return new Date(y, (m||1)-1, d||1); };
const addDays = (s,n) => { const d = parseYmd(s); d.setDate(d.getDate()+n); return ymd(d); };
const monthOf = s => String(s||"").slice(0,7);
const addMonths = (m,n) => { let y=+m.slice(0,4), mo=+m.slice(5,7)+n; while(mo>12){mo-=12;y++} while(mo<1){mo+=12;y--} return `${y}-${pad(mo)}`; };
const monthDiff = (a,b) => (+b.slice(0,4)-+a.slice(0,4))*12 + (+b.slice(5,7)-+a.slice(5,7));
const cap = s => s ? s.charAt(0).toUpperCase()+s.slice(1) : s;
const monthLabel = m => new Date(+m.slice(0,4), +m.slice(5,7)-1, 1).toLocaleDateString("fr-FR",{month:"long",year:"numeric"});
const monthShort = m => new Date(+m.slice(0,4), +m.slice(5,7)-1, 1).toLocaleDateString("fr-FR",{month:"short"});
const dayLabel = s => cap(parseYmd(s).toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"}));
const dayShort = s => parseYmd(s).toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit"});
const toMin = t => { const [h,m] = String(t||"0:0").split(":").map(Number); return (h||0)*60+(m||0); };
const fromMin = n => `${pad(Math.floor(n/60))}:${pad(n%60)}`;
const nf = new Intl.NumberFormat("fr-FR",{maximumFractionDigits:0});
const fmt = n => nf.format(Math.round(+n||0));
const fmtDH = n => fmt(n) + " DH";
const fmtSigned = n => (n<0?"−":"+") + fmt(Math.abs(n)) + " DH";
const pct = (a,b) => b ? Math.round(a/b*100) : 0;
const sum = (arr, f) => arr.reduce((s,x) => s + (+f(x)||0), 0);
const push = (map,k,v) => { const a = map.get(k); if (a) a.push(v); else map.set(k,[v]); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const TODAY = ymd(new Date());

const ICONS = {
  agenda:'<rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
  patients:'<circle cx="12" cy="8" r="3.6"/><path d="M4.5 20.5c.6-3.8 3.8-5.8 7.5-5.8s6.9 2 7.5 5.8"/>',

  charges:'<path d="M6 3h12v18l-3-1.8L12 21l-3-1.8L6 21z"/><path d="M9 8h6M9 12h6"/>',
  resultat:'<path d="M4 20V11M10 20V5M16 20v-6M3 20.5h18"/>',

  plus:'<path d="M12 5v14M5 12h14"/>', check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  left:'<path d="M14.5 6l-6 6 6 6"/>', right:'<path d="M9.5 6l6 6-6 6"/>', close:'<path d="M6 6l12 12M18 6L6 18"/>',
  search:'<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/>', chat:'<path d="M4 19.5l1.4-4A7.8 7.8 0 1 1 8.6 19z"/>',
  phone:'<circle cx="12" cy="12" r="9.5"/><path d="M9.2 7.5l1.3 2.6-1 1a6.5 6.5 0 0 0 3.4 3.4l1-1 2.6 1.3-.5 1.6c-4 .5-8.4-3.9-7.9-7.9z"/>',
  mobile:'<rect x="7" y="2.5" width="10" height="19" rx="2"/><path d="M11 18.5h2"/>',
  mail:'<circle cx="12" cy="12" r="9.5"/><rect x="7" y="8.5" width="10" height="7" rx="1"/><path d="M7.3 9l4.7 3.6L16.7 9"/>',
  home:'<circle cx="12" cy="12" r="9.5"/><path d="M7.5 12L12 7.8l4.5 4.2M9 11v5h6v-5"/>'
};
const ic = n => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]||""}</svg>`;

/* ================= État ================= */
const S = {
  db:null, user:null, canWrite:null, readonly:false,
  fdb:null, fbAuth:null, fbUser:null, gate:null, started:false, legacy:null, verifySent:false, leaving:false,
  status:"loading", loadTimer:null, lostMsg:"",
  config:null, patients:new Map(), patientsReady:false,
  months:new Map(),
  view:"agenda", day:TODAY, month:monthOf(TODAY),
  search:"", pfilter:"tous", shellKey:"", settingsDirty:false,
  drawer:null, D:null
};
const cfg = () => Object.assign({}, DEFAULTS, S.config || {});

/* ================= Base de données ================= */
const errCode = e => String(e && e.code || "").replace(/-/g, "_"); // Firestore : "permission-denied" → "permission_denied"
function onDbError(e){
  if (!e || S.leaving) return; // à la déconnexion, la base ferme ses écoutes : rien à signaler
  console.error(e);
  const c = errCode(e);
  if (c === "revoked"){ S.status = "lost"; S.lostMsg = "L'accès aux données a été retiré pour cette vue."; }
  else if (c === "permission_denied"){ S.status = "lost"; S.lostMsg = "Accès refusé par la base en ligne. Reconnecte-toi avec le compte du cabinet."; }
  else if (c === "resource_exhausted"){ S.status = "lost"; S.lostMsg = "Le quota gratuit Firebase du jour est atteint. Les données reviennent demain ; pour lever la limite, passe le projet Firebase en formule Blaze."; }
  else if (c === "unavailable"){ S.status = "lost"; S.lostMsg = "La connexion aux données est interrompue. Recharge la page."; }
  schedule();
}
// Avec le cache hors ligne, Firestore ne prévient du retour du serveur que si on demande les changements de métadonnées
const watch = (ref, next) => S.mode === "firebase" ? ref.onSnapshot({includeMetadataChanges:true}, next, onDbError) : ref.onSnapshot(next, onDbError);
function markFresh(fromCache){
  if (!fromCache && (S.status === "loading" || S.status === "slow")){ S.status = "ready"; clearTimeout(S.loadTimer); }
}
function ensureMonth(m){
  if (!S.db || S.months.has(m)) return;
  const e = {rdv:new Map(), pay:new Map(), chg:new Map(), unsubs:[]};
  S.months.set(m, e);
  [["rdv","rdv"],["pay","paiements"],["chg","charges"]].forEach(([k,coll]) => {
    try{
      e.unsubs.push(watch(S.db.collection(`mois/${m}/${coll}`), snap => {
        const map = new Map(); snap.docs.forEach(d => map.set(d.id, d.data()));
        e[k] = map; markFresh(snap.metadata.fromCache); schedule();
      }));
    }catch(err){ console.error(err); }
  });
  // garder le nombre d'abonnements sous la limite : on libère les mois les plus éloignés
  const keep = new Set(baseWindow());
  for (let i=0;i<6;i++) keep.add(addMonths(S.month,-i));
  if (S.months.size > 16){
    const far = [...S.months.keys()].filter(k => !keep.has(k)).sort((a,b) => Math.abs(monthDiff(b,S.month)) - Math.abs(monthDiff(a,S.month)));
    while (S.months.size > 16 && far.length){ const k = far.shift(); S.months.get(k).unsubs.forEach(u => u()); S.months.delete(k); }
  }
}
function baseWindow(){ const m0 = monthOf(TODAY); const out=[]; for (let i=-5;i<=1;i++) out.push(addMonths(m0,i)); return out; }
const rdvRef = (m,id) => S.db.collection(`mois/${m}/rdv`).doc(id);

// Firestore ne confirme une écriture qu'au retour du serveur. Hors ligne, elle est déjà dans le cache
// de l'appareil et partira seule au retour de la connexion : on n'attend pas plus de 2,5 s.
function settle(p){
  if (S.mode !== "firebase" || !p || typeof p.then !== "function") return p;
  return Promise.race([p.then(() => "ok"), new Promise(r => setTimeout(() => r("pending"), 2500))]).then(r => {
    if (r === "pending") p.catch(e => { console.error(e); toast("Une modification n'a pas pu être enregistrée en ligne.", true); });
    return r;
  });
}
const pendingNote = r => r === "pending" ? " (hors ligne : envoi au retour de la connexion)" : "";
async function write(fn, okMsg, waitServer){ // waitServer : attendre la confirmation (imports en plusieurs lots)
  if (!S.db){ toast("Les données ne sont pas accessibles dans cette vue.", true); return false; }
  if (S.readonly){ toast("Lecture seule : modification impossible.", true); return false; }
  const run = () => waitServer ? fn() : settle(fn());
  try{ const r = await run(); if (okMsg) toast(okMsg + pendingNote(r)); return true; }
  catch(e){
    if (errCode(e) === "unavailable"){
      await new Promise(r => setTimeout(r, 400 + Math.random()*600));
      try{ const r = await run(); if (okMsg) toast(okMsg + pendingNote(r)); return true; }catch(e2){ e = e2; }
    }
    writeError(e); return false;
  }
}
function writeError(e){
  console.error(e);
  const c = errCode(e);
  if (c === "permission_denied") toast("Accès refusé : reconnecte-toi avec le compte du cabinet.", true);
  else if (c === "invalid_argument"){
    if (S.canWrite !== true){ S.readonly = true; schedule(); toast("Ton accès ne permet pas de modifier les données.", true); }
    else toast("Enregistrement refusé : une valeur est invalide.", true);
  } else if (c === "quota_exceeded") toast("La base est pleine. Supprime d'anciennes données (les exemples, par exemple).", true);
  else if (c === "resource_exhausted") toast("Trop de modifications d'un coup. Réessaie dans quelques secondes.", true);
  else toast("Échec de l'enregistrement. Vérifie la connexion puis réessaie.", true);
}
async function pool(tasks, n, onStep){
  let i = 0, done = 0;
  const worker = async () => { while (i < tasks.length){ const t = tasks[i++]; await t(); done++; onStep && onStep(done); } };
  await Promise.all(Array.from({length:Math.min(n, tasks.length)}, worker));
}

/* ================= Dérivés ================= */
function derive(){
  const rdv=[], pays=[], chg=[];
  for (const [m,e] of S.months){
    for (const [id,r] of e.rdv) rdv.push(Object.assign({}, r, {id, m}));
    for (const [id,p] of e.pay) pays.push(Object.assign({}, p, {id, m}));
    for (const [id,c] of e.chg) chg.push(Object.assign({}, c, {id, m}));
  }
  rdv.sort((a,b) => (a.date+(a.heure||"")).localeCompare(b.date+(b.heure||"")));
  const byDay = new Map(), byPat = new Map(), payByPat = new Map();
  rdv.forEach(r => { push(byDay, r.date, r); push(byPat, r.patientId, r); });
  pays.forEach(p => push(payByPat, p.patientId, p));
  const pstats = new Map();
  for (const [pid,p] of S.patients){
    const list = byPat.get(pid) || [];
    const start = p.dateOrdonnance || "0000-00-00";
    let n=0, eff=0, plan=0, abs=0; const num = new Map();
    list.forEach(r => {
      if (r.date < start) return;
      if (r.statut === "effectue" || r.statut === "prevu"){ n++; num.set(r.id, n); r.statut === "effectue" ? eff++ : plan++; }
      else if (r.statut === "absent") abs++;
    });
    const du = sum(list.filter(r => r.statut === "effectue"), r => r.montant);
    const regl = sum(list, r => r.reglement ? r.reglement.montant : 0) + sum(payByPat.get(pid)||[], x => x.montant);
    const evas = list.filter(r => r.statut === "effectue" && r.eva !== null && r.eva !== undefined && r.eva !== "").map(r => ({date:r.date, eva:+r.eva}));
    const next = list.find(r => r.statut === "prevu" && r.date >= TODAY);
    const pres = +p.seancesPrescrites || 0;
    const alerts = [];
    if (pres){
      const over = n - pres;
      if (over > 0 && list.some(r => r.statut === "prevu" && num.get(r.id) > pres)) alerts.push({c:"tape", t:`${over} séance${over>1?"s":""} hors ordonnance`});
      if (eff >= pres){
        if (p.couverture && p.couverture !== "Sans couverture" && !p.feuilleSoins) alerts.push({c:"warn", t:"Feuille de soins à remettre"});
      } else if (eff >= pres - 2) alerts.push({c:"warn", t:`Plus que ${pres - eff} séance${pres-eff>1?"s":""} : renouvellement ?`});
    }
    const done = pres > 0 && eff >= pres && plan === 0;
    pstats.set(pid, {list, num, eff, plan, abs, n, du, regl, solde: du - regl, evas, next, pres, alerts, done,
      active: list.some(r => r.date >= start && (r.statut === "prevu" || r.statut === "effectue")) && (plan > 0 || !pres || eff < pres)});
  }
  return {rdv, pays, chg, byDay, byPat, payByPat, pstats};
}

function finance(m, D){
  const c = cfg();
  const rdvM = D.rdv.filter(r => monthOf(r.date) === m);
  const eff = rdvM.filter(r => r.statut === "effectue");
  const ca = sum(eff, r => r.montant);
  const nEff = eff.length, nAbs = rdvM.filter(r => r.statut === "absent").length, nAnn = rdvM.filter(r => r.statut === "annule").length;
  const encR = D.rdv.filter(r => r.reglement && monthOf(r.reglement.date || r.date) === m);
  const encP = D.pays.filter(p => monthOf(p.date) === m);
  const byMode = {especes:0, carte:0, virement:0, cheque:0};
  encR.forEach(r => { byMode[r.reglement.mode] = (byMode[r.reglement.mode]||0) + (+r.reglement.montant||0); });
  encP.forEach(p => { byMode[p.mode] = (byMode[p.mode]||0) + (+p.montant||0); });
  const enc = sum(encR, r => r.reglement.montant) + sum(encP, p => p.montant);
  const fixes = (c.chargesFixes||[]).filter(f => f.depuis && f.depuis <= m && (!f.fin || m <= f.fin));
  const totFixes = sum(fixes, f => f.montant);
  const ponct = D.chg.filter(x => monthOf(x.date) === m);
  const totPonct = sum(ponct, x => x.montant);
  const amorts = (c.materiel||[]).map(x => {
    const dur = (+x.dureeAns||0) * 12; if (!x.achat || !dur) return null;
    const k = monthDiff(x.achat, m); if (k < 0 || k >= dur) return null;
    return Object.assign({}, x, {dot:(+x.valeur||0)/dur});
  }).filter(Boolean);
  const totAmort = sum(amorts, a => a.dot);
  const charges = totFixes + totPonct + totAmort;
  const resultat = ca - charges;
  const taux = +c.tauxImpot || 0;
  const impot = resultat > 0 ? resultat * taux / 100 : 0;
  const prixMoyen = nEff ? ca / nEff : (+c.tarifDefaut||0);
  // consommables saisis = coût variable réel ; sinon estimation des réglages
  const conso = sum(ponct.filter(x => x.categorie === "Consommables"), x => x.montant);
  const consoReel = !!(nEff && conso);
  const vu = consoReel ? conso / nEff : (+c.coutVariableSeance||0);
  const margeU = prixMoyen - vu;
  const structure = totFixes + totAmort + totPonct - (consoReel ? conso : 0);
  const seuil = margeU > 0 ? Math.ceil(structure / margeU) : null;
  const byCat = new Map();
  fixes.forEach(f => byCat.set(f.categorie||"Divers", (byCat.get(f.categorie||"Divers")||0) + (+f.montant||0)));
  ponct.forEach(x => byCat.set(x.categorie||"Divers", (byCat.get(x.categorie||"Divers")||0) + (+x.montant||0)));
  return {m, rdvM, nEff, nAbs, nAnn, ca, enc, encR, encP, byMode, fixes, totFixes, ponct, totPonct, amorts, totAmort, charges,
    resultat, taux, impot, net: resultat - impot, prixMoyen, seuil, byCat, vu, consoReel, structure,
    tauxAbs: (nEff+nAbs) ? nAbs/(nEff+nAbs) : 0, coutSeance: nEff ? charges/nEff : null,
    tresorerie: enc - totFixes - totPonct};
}
function firstActivityMonth(D){
  const c = cfg(); let first = null;
  const take = m => { if (m && (!first || m < first)) first = m; };
  (c.chargesFixes||[]).forEach(f => take(f.depuis)); (c.materiel||[]).forEach(x => take(x.achat));
  if (D.rdv.length) take(monthOf(D.rdv[0].date));
  D.pays.forEach(p => take(monthOf(p.date))); D.chg.forEach(x => take(monthOf(x.date)));
  return first;
}

/* ================= Agenda ================= */
function slotsFor(day){
  const c = cfg(); const dow = parseYmd(day).getDay();
  const open = (c.joursOuvres||[]).map(Number).includes(dow);
  const end = (dow === 6 && c.samediFermeture) ? c.samediFermeture : c.fermeture;
  const step = Math.max(10, +c.pas || 30); const out = [];
  for (let t = toMin(c.ouverture); t < toMin(end); t += step) out.push(fromMin(t));
  return {open, slots:out, step};
}
const active = r => r.statut === "prevu" || r.statut === "effectue";
function viewAgenda(D){
  const c = cfg(); const day = S.day;
  const {open, slots, step} = slotsFor(day);
  const list = D.byDay.get(day) || [];
  const dIdx = (parseYmd(day).getDay() + 6) % 7; const monday = addDays(day, -dIdx);
  let week = "";
  for (let i=0;i<7;i++){
    const d = addDays(monday, i); const dd = parseYmd(d);
    const n = (D.byDay.get(d)||[]).filter(active).length;
    const isOpen = (c.joursOuvres||[]).map(Number).includes(dd.getDay());
    week += `<button class="wd ${d===TODAY?"today":""} ${isOpen?"":"closed"}" aria-pressed="${d===day}" data-action="day" data-day="${d}">
      <span class="l">${esc(dd.toLocaleDateString("fr-FR",{weekday:"short"}).replace(".",""))}</span><span class="n">${dd.getDate()}</span><span class="c">${n ? n+" rdv" : "—"}</span></button>`;
  }
  const prev = list.filter(r => r.statut === "prevu").length, eff = list.filter(r => r.statut === "effectue"), abs = list.filter(r => r.statut === "absent").length;
  const encDay = sum(D.rdv.filter(r => r.reglement && r.reglement.date === day), r => r.reglement.montant) + sum(D.pays.filter(p => p.date === day), p => p.montant);
  const stats = `<div class="stats">
    <div><span>Prévus</span><b>${prev}</b></div><div><span>Effectués</span><b>${eff.length}</b></div><div><span>Absents</span><b>${abs}</b></div>
    <div><span>Réalisé</span><b>${fmtDH(sum(eff, r => r.montant))}</b></div><div><span>Encaissé</span><b>${fmtDH(encDay)}</b></div></div>`;
  const bySlot = new Map(slots.map(s => [s, []])); const outside = [];
  list.forEach(r => {
    const t = toMin(r.heure); let s = null;
    for (const x of slots){ if (toMin(x) <= t) s = x; else break; }
    if (s && t < toMin(slots[slots.length-1]) + step) bySlot.get(s).push(r); else outside.push(r);
  });
  const postes = Math.max(1, +c.postes || 1);
  const nowMin = new Date().getHours()*60 + new Date().getMinutes();
  let rows = "";
  if (outside.length) rows += `<div class="slot"><time>Hors<br>horaire</time><div class="cards" style="--postes:${postes}">${outside.map(r => rdvCard(r, D)).join("")}</div></div>`;
  slots.forEach(s => {
    const rs = bySlot.get(s); const used = rs.filter(active).length;
    const isNow = day === TODAY && nowMin >= toMin(s) && nowMin < toMin(s) + step;
    const addBtn = used < postes ? `<button class="add" data-action="new-rdv" data-date="${day}" data-time="${s}" data-write aria-label="Ajouter un rendez-vous à ${s}">+ ${s}</button>` : "";
    rows += `<div class="slot ${isNow?"now":""}"><time>${s}</time><div class="cards" style="--postes:${postes}">${rs.map(r => rdvCard(r, D)).join("")}${addBtn}</div></div>`;
  });
  const tl = `<section class="tl" aria-label="Rendez-vous du jour">
    <div class="tl-head"><span>${open ? `${slots[0]||""} – ${fromMin(toMin(slots[slots.length-1]||"0:0")+step)} · ${postes} patient${postes>1?"s":""} en parallèle` : "Cabinet fermé ce jour"}</span><span>${list.filter(active).length} rendez-vous</span></div>
    ${(open || list.length) ? rows : `<div class="empty"><b>Jour de fermeture</b>Choisis un autre jour dans la semaine.</div>`}</section>`;
  return `<div class="daybar">
      <div class="navpair"><button class="btn icon-btn" data-action="day-shift" data-n="-7" aria-label="Semaine précédente">${ic("left")}</button></div>
      <div class="week">${week}</div>
      <div class="navpair"><button class="btn icon-btn" data-action="day-shift" data-n="7" aria-label="Semaine suivante">${ic("right")}</button>
      <button class="btn" data-action="day" data-day="${TODAY}">Aujourd'hui</button></div>
    </div>${stats}
    <div class="ag">${tl}<aside class="side stack">${remindersBox(D)}${followBox(D)}</aside></div>`;
}
function rdvCard(r, D){
  const p = S.patients.get(r.patientId); const st = D.pstats.get(r.patientId);
  const n = st && st.num.get(r.id); const pres = st ? st.pres : 0;
  const hors = n && pres && n > pres;
  let acts = "";

    ${hors ? `<div class="hw">Hors ordonnance : non remboursable</div>` : ""}
    ${acts ? `<div class="ra">${acts}</div>` : ""}</article>`;
}
function waNumber(tel){

function reminderText(r, p, when){
  const c = cfg();
  return String(c.messageRappel||DEFAULTS.messageRappel).replace(/\{patient\}/g, p ? p.nom : "").replace(/\{jour\}/g, when).replace(/\{heure\}/g, r.heure.replace(":","h"));
}
function remindersBox(D){
  let target = null;
  for (let i=1;i<=7;i++){ const d = addDays(TODAY, i); if ((D.byDay.get(d)||[]).some(r => r.statut === "prevu")){ target = d; break; } }
  if (!target) return `<section class="box"><h3>Rappels</h3><p class="hint">Aucun rendez-vous prévu dans les 7 prochains jours.</p></section>`;
  const when = target === addDays(TODAY,1) ? "demain" : "le " + parseYmd(target).toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
  const rs = (D.byDay.get(target)||[]).filter(r => r.statut === "prevu");
  const items = rs.map(r => {
    const p = S.patients.get(r.patientId); const num = waNumber(p && p.tel);
    const link = num ? `<a class="btn sm" href="https://wa.me/${num}?text=${encodeURIComponent(reminderText(r,p,when))}" target="_blank" rel="noopener">${ic("chat")}WhatsApp</a>` : `<span class="chip warn">Pas de numéro</span>`;
    return `<li><div class="r1"><button class="linkish" data-action="open-patient" data-id="${esc(r.patientId)}">${esc(p ? p.nom : "Patient supprimé")}</button><span class="mono">${esc(r.heure)}</span></div>
      <div class="r2"><span class="mono">${esc(p && p.tel || "")}</span>${link}</div></li>`;
  }).join("");
  return `<section class="box"><h3>Rappels · ${esc(cap(when))}<span class="chip">${rs.length}</span></h3><ul class="alist">${items}</ul>
    <p class="hint" style="margin-top:10px">Le lien ouvre WhatsApp avec le message prêt. Vérifie qu'il est bien parti.</p></section>`;
}
function followBox(D){
  const rows = [];
  for (const [pid,st] of D.pstats){ if (st.alerts.length) rows.push([pid, st]); }
  rows.sort((a,b) => (b[1].alerts.some(x=>x.c==="tape")?1:0) - (a[1].alerts.some(x=>x.c==="tape")?1:0));
  const items = rows.slice(0,8).map(([pid,st]) => { const p = S.patients.get(pid);
    return `<li><div class="r1"><button class="linkish" data-action="open-patient" data-id="${esc(pid)}">${esc(p.nom)}</button><span class="mono">${st.eff}/${st.pres}</span></div>
      <div class="r2">${st.alerts.map(a => `<span class="chip ${a.c}">${esc(a.t)}</span>`).join("")}</div></li>`; }).join("");
  if (!S.patients.size) return `<section class="box"><h3>Premiers pas</h3><p class="hint">Ajoute un patient avec son ordonnance (nombre de séances prescrites), puis planifie sa série de séances depuis un créneau.</p></section>`;
  return `<section class="box"><h3>Suivi des ordonnances${rows.length?`<span class="chip">${rows.length}</span>`:""}</h3>${items ? `<ul class="alist">${items}</ul>` : `<p class="hint">Aucune ordonnance à renouveler ni feuille de soins en attente.</p>`}</section>`;
}

/* ================= Patients ================= */
function patientsShell(){
  const f = [["tous","Tous"],["encours","En cours"],["alertes","À traiter"],["impayes","Impayés"]];
  return `<div class="toolbar"><label class="search">${ic("search")}<input id="pSearch" type="search" placeholder="Rechercher un nom, un téléphone, un motif…" value="${esc(S.search)}" aria-label="Rechercher un patient"></label>
    <div class="seg" role="group" aria-label="Filtrer">${f.map(([k,l]) => `<button data-action="pfilter" data-f="${k}" aria-pressed="${S.pfilter===k}">${l}</button>`).join("")}</div></div>
    <div id="plistWrap"></div>`;
}
function patientsList(D){
  const q = S.search.trim().toLowerCase();
  let ps = [...S.patients.entries()].map(([id,p]) => ({id, p, st:D.pstats.get(id)}));
  if (q) ps = ps.filter(x => [x.p.nom, x.p.tel, x.p.motif, x.p.prescripteur].join(" ").toLowerCase().includes(q));
  if (S.pfilter === "encours") ps = ps.filter(x => x.st.active);
  if (S.pfilter === "alertes") ps = ps.filter(x => x.st.alerts.length);
  if (S.pfilter === "impayes") ps = ps.filter(x => x.st.solde > 0.5);
  ps.sort((a,b) => (b.st.active - a.st.active) || String(a.p.nom).localeCompare(String(b.p.nom), "fr"));
  if (!ps.length) return `<div class="plist"><div class="empty"><b>${S.patients.size ? "Aucun patient ne correspond" : "Aucun patient pour l'instant"}</b>${S.patients.size ? "Change la recherche ou le filtre." : "Ajoute le premier patient avec le bouton « Patient »."}</div></div>`;
  return `<div class="plist"><div class="phead"><span>Patient</span><span class="pmot">Ordonnance</span><span>Séances</span><span style="text-align:right">Solde</span></div>` +
    ps.map(({id,p,st}) => {
      const pres = st.pres; const w1 = pres ? Math.min(100, st.eff/pres*100) : 0; const w2 = pres ? Math.max(0, Math.min(100 - w1, st.plan/pres*100)) : 0;
      const over = pres && st.eff + st.plan > pres;
      const solde = st.solde > 0.5 ? `<b style="color:var(--bad)">${fmtDH(st.solde)}</b><small class="muted">à encaisser</small>` : st.solde < -0.5 ? `<b>${fmtDH(-st.solde)}</b><small class="muted">d'avance</small>` : `<b class="muted">0 DH</b>`;
      return `<button class="prow" data-action="open-patient" data-id="${esc(id)}">
        <span class="pn"><b>${esc(p.nom)}</b><span class="tags">${p.couverture?`<span class="chip">${esc(COUV_SHORT[p.couverture]||p.couverture)}</span>`:""}${st.done?`<span class="chip good">Traitement terminé</span>`:""}${st.alerts.map(a => `<span class="chip ${a.c}">${esc(a.t)}</span>`).join("")}${p.exemple?`<span class="chip ex">Exemple</span>`:""}</span></span>
        <span class="pn pmot"><small>${esc(p.motif||"Motif non renseigné")}</small><small>${p.dateOrdonnance?"Ordonnance du "+esc(dayShort(p.dateOrdonnance)):""}${p.prescripteur?" · "+esc(p.prescripteur):""}</small></span>
        <span class="prog"><span class="bar" aria-hidden="true"><i style="width:${w1}%"></i><i class="plan ${over?"over":""}" style="width:${w2}%"></i></span>
          <span>${st.eff} faite${st.eff>1?"s":""}${st.plan?` + ${st.plan} prévue${st.plan>1?"s":""}`:""}${pres?` / ${pres}`:""}${st.next?` · prochaine ${esc(dayShort(st.next.date))}`:""}</span></span>
        <span class="solde">${solde}</span></button>`;
    }).join("") + `</div>`;
}

/* ================= Caisse ================= */
function monthNav(){ return `<div class="mnav"><button class="btn" data-action="m-shift" data-n="-1" aria-label="Mois précédent">${ic("left")}</button><strong>${esc(monthLabel(S.month))}</strong><button class="btn" data-action="m-shift" data-n="1" aria-label="Mois suivant">${ic("right")}</button></div>`; }
function viewCaisse(D){
  const F = finance(S.month, D);
  const maxMode = Math.max(1, ...Object.values(F.byMode));
  const modes = Object.entries(MODES).map(([k,l]) => `<div class="mb"><span>${l}</span><span class="bar"><i style="width:${(F.byMode[k]||0)/maxMode*100}%"></i></span><span class="num">${fmtDH(F.byMode[k]||0)}</span></div>`).join("");
  const lines = [
    ...F.encR.map(r => ({date:r.reglement.date || r.date, pid:r.patientId, orig:`Séance du ${dayShort(r.date)}`, mode:r.reglement.mode, montant:+r.reglement.montant||0, kind:"r", id:r.id, m:r.m})),
    ...F.encP.map(p => ({date:p.date, pid:p.patientId, orig:p.note || "Paiement / avance", mode:p.mode, montant:+p.montant||0, kind:"p", id:p.id, m:p.m}))
  ].sort((a,b) => b.date.localeCompare(a.date));
  const rows = lines.map(x => { const p = S.patients.get(x.pid);
    const del = x.kind === "p" ? `<button class="btn sm ghost" data-action="del-payment" data-id="${x.id}" data-m="${x.m}" data-confirm data-write>Supprimer</button>`
      : `<button class="btn sm ghost" data-action="open-rdv" data-id="${x.id}" data-m="${x.m}">Voir</button>`;
    return `<tr><td class="mono">${esc(dayShort(x.date))}</td><td>${esc(p ? p.nom : "—")}</td><td class="muted">${esc(x.orig)}</td><td>${esc(MODES[x.mode]||x.mode||"")}</td><td class="num">${fmtDH(x.montant)}</td><td style="text-align:right">${del}</td></tr>`; }).join("");
  const dues = [...D.pstats.entries()].filter(([,s]) => s.solde > 0.5).sort((a,b) => b[1].solde - a[1].solde);
  const totDue = sum(dues, ([,s]) => s.solde);
  const dueRows = dues.map(([pid,s]) => `<li><div class="r1"><button class="linkish" data-action="open-patient" data-id="${esc(pid)}">${esc(S.patients.get(pid).nom)}</button><span class="num" style="color:var(--bad)">${fmtDH(s.solde)}</span></div>
    <div class="r2">${s.eff} séance${s.eff>1?"s":""} faite${s.eff>1?"s":""} · ${fmtDH(s.regl)} réglés <button class="btn sm" data-action="new-payment" data-patient="${esc(pid)}" data-amount="${Math.round(s.solde)}" data-write>Encaisser</button></div></li>`).join("");
  return `<div class="toolbar">${monthNav()}</div>
    <div class="kpis">
      <div class="kpi"><span>Encaissé</span><b>${fmtDH(F.enc)}</b><small>${lines.length} opération${lines.length>1?"s":""}</small></div>
      <div class="kpi"><span>Réalisé</span><b>${fmtDH(F.ca)}</b><small>${F.nEff} séance${F.nEff>1?"s":""} effectuée${F.nEff>1?"s":""}</small></div>
      <div class="kpi"><span>Écart du mois</span><b>${fmtSigned(F.enc - F.ca)}</b><small>encaissé − réalisé</small></div>
      <div class="kpi"><span>Reste à encaisser</span><b style="color:${totDue?"var(--bad)":"inherit"}">${fmtDH(totDue)}</b><small>tous patients, tous mois chargés</small></div>
    </div>
    <div class="grid2"><section class="box"><h3>Encaissements du mois</h3>${rows ? `<div class="tbl-wrap"><table><thead><tr><th>Date</th><th>Patient</th><th>Origine</th><th>Mode</th><th class="num">Montant</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>` : `<div class="empty"><b>Aucun encaissement ce mois-ci</b>Encaisse une séance depuis l'agenda ou enregistre une avance.</div>`}</section>
      <div class="stack"><section class="box"><h3>Par mode de paiement</h3><div class="modes-bars">${modes}</div></section>
      <section class="box"><h3>Impayés<span class="chip ${dues.length?"bad":""}">${dues.length}</span></h3>${dueRows ? `<ul class="alist">${dueRows}</ul>` : `<p class="hint">Aucun patient ne doit d'argent au cabinet.</p>`}</section></div></div>`;
}

    <p class="note">Les charges fixes (loyer, salaires, CNSS employeur…) s'appliquent automatiquement chaque mois depuis Réglages. Ici, saisis les dépenses ponctuelles : consommables, réparations, factures.</p></section>`;

/* ================= Résultat ================= */
function niceStep(v){ const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v/p; return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p; }
const fmtAxis = v => v >= 1000 ? (v/1000).toLocaleString("fr-FR",{maximumFractionDigits:1}) + " k" : String(Math.round(v));
function chartSvg(series){
  const W = 640, H = 250, L = 52, R = 10, T = 12, B = 54;
  const peak = Math.max(1, ...series.flatMap(s => [s.ca, s.charges]));
  const step = niceStep(peak/4); const max = step*4;
  const y = v => T + (H-T-B) * (1 - v/max);
  const gw = (W-L-R)/series.length; const bw = Math.max(8, Math.min(30, (gw-22)/2));
  let g = "";
  for (let i=1;i<=4;i++){ const yy = y(step*i).toFixed(1); g += `<line class="gl" x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}"/><text class="ax" x="${L-8}" y="${(+yy+4).toFixed(1)}" text-anchor="end">${fmtAxis(step*i)}</text>`; }
  g += `<text class="ax" x="${L-8}" y="${(y(0)+4).toFixed(1)}" text-anchor="end">0</text>`;
  const bar = (x, v, cls) => { const yt = y(v), yb = y(0), h = yb - yt; if (h < .5) return ""; const r = Math.min(4, h, bw/2);
    return `<path class="${cls}" d="M${x.toFixed(1)},${yb.toFixed(1)}V${(yt+r).toFixed(1)}Q${x.toFixed(1)},${yt.toFixed(1)} ${(x+r).toFixed(1)},${yt.toFixed(1)}H${(x+bw-r).toFixed(1)}Q${(x+bw).toFixed(1)},${yt.toFixed(1)} ${(x+bw).toFixed(1)},${(yt+r).toFixed(1)}V${yb.toFixed(1)}Z"/>`; };
  series.forEach((s,i) => {
    const cx = L + gw*i + gw/2;
    g += bar(cx - bw - 1, s.ca, "bar-a") + bar(cx + 1, s.charges, "bar-b");
    g += `<text class="ml" x="${cx.toFixed(1)}" y="${H-B+18}" text-anchor="middle">${esc(cap(monthShort(s.m).replace(".","")))}</text>`;
    g += `<text class="rl" x="${cx.toFixed(1)}" y="${H-B+36}" text-anchor="middle">${s.res<0?"−":"+"}${fmt(Math.abs(s.res))}</text>`;
    const tip = `${cap(monthLabel(s.m))}<br>Honoraires : ${fmtDH(s.ca)}<br>Charges : ${fmtDH(s.charges)}<br>Résultat : ${fmtSigned(s.res)}`;
    g += `<rect class="hit" x="${(L+gw*i+2).toFixed(1)}" y="${T}" width="${(gw-4).toFixed(1)}" height="${H-T-B+40}" rx="6" tabindex="0" data-tip="${esc(tip)}" aria-label="${esc(tip.replace(/<br>/g,", "))}"/>`;
  });
  g += `<line class="base" x1="${L}" x2="${W-R}" y1="${y(0).toFixed(1)}" y2="${y(0).toFixed(1)}"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Honoraires et charges par mois">${g}</svg>`;
}
function viewResultat(D){
  const F = finance(S.month, D);
  const first = firstActivityMonth(D);
  const months = []; for (let i=5;i>=0;i--){ const m = addMonths(S.month,-i); ensureMonth(m); if (!first || m >= first) months.push(m); }
  const series = months.map(m => { const f = finance(m, D); return {m, ca:f.ca, charges:f.charges, res:f.resultat}; });
  const neg = F.resultat < 0;
  const dues = sum([...D.pstats.values()].filter(s => s.solde > 0), s => s.solde);
  const cats = [...F.byCat.entries()].sort((a,b) => b[1]-a[1]).map(([k,v]) => `<tr><td class="ind">${esc(k)}</td><td class="num">${fmtDH(v)}</td></tr>`).join("");
  const seuilTxt = F.seuil === null ? "Non calculable" : `${F.seuil} séances / mois`;
  const seuilPct = F.seuil ? Math.min(100, F.nEff / F.seuil * 100) : 0;
  return `<div class="toolbar">${monthNav()}</div>
    <div class="kpis k6">
      <div class="kpi hero ${neg?"neg":"pos"}"><span>Résultat avant impôt</span><b>${fmtSigned(F.resultat)}</b><small>${F.ca ? "Marge : " + pct(F.resultat, F.ca) + " % des honoraires" : "Aucune séance effectuée ce mois"}</small></div>
      <div class="kpi"><span>Honoraires</span><b>${fmtDH(F.ca)}</b><small>${F.nEff} séances</small></div>
      <div class="kpi"><span>Charges</span><b>${fmtDH(F.charges)}</b><small>dont ${fmtDH(F.totAmort)} amort.</small></div>
      <div class="kpi"><span>Encaissé</span><b>${fmtDH(F.enc)}</b><small>trésorerie ${fmtSigned(F.tresorerie)}</small></div>
      <div class="kpi"><span>À encaisser</span><b>${fmtDH(dues)}</b><small>créances patients</small></div>
    </div>
    <div class="grid2">
      <div class="stack">
        <section class="box"><h3>Évolution sur ${series.length} mois</h3>
          ${series.length && series.some(s => s.ca || s.charges) ? `<div class="legend"><span><i style="background:var(--chart-a)"></i>Honoraires réalisés</span><span><i style="background:var(--chart-b)"></i>Charges (amortissements inclus)</span><span class="muted">Sous chaque mois : résultat</span></div>
          <div class="chart" id="chart">${chartSvg(series)}<div class="tip" id="tip" hidden></div></div>
          <details class="tblv"><summary>Voir les chiffres</summary><div class="tbl-wrap"><table><thead><tr><th>Mois</th><th class="num">Honoraires</th><th class="num">Charges</th><th class="num">Résultat</th></tr></thead><tbody>${series.map(s => `<tr><td>${esc(cap(monthLabel(s.m)))}</td><td class="num">${fmtDH(s.ca)}</td><td class="num">${fmtDH(s.charges)}</td><td class="num">${fmtSigned(s.res)}</td></tr>`).join("")}</tbody></table></div></details>`
          : `<div class="empty"><b>Pas encore de données</b>Les mois apparaissent dès les premières séances ou charges.</div>`}
        </section>
        <section class="box"><h3>Indicateurs de pilotage</h3><dl class="ind-list">
          <div><dt>Prix moyen d'une séance</dt><dd>${fmtDH(F.prixMoyen)}</dd></div>
          <div><dt>Coût de revient d'une séance</dt><dd>${F.coutSeance === null ? "—" : fmtDH(F.coutSeance)}</dd></div>
          <div><dt>Consommables par séance</dt><dd>${F.vu.toLocaleString("fr-FR",{maximumFractionDigits:1})} DH${F.consoReel ? "" : " (estimé)"}</dd></div>
          <div><dt>Taux d'absence</dt><dd>${Math.round(F.tauxAbs*100)} % (${F.nAbs} absent${F.nAbs>1?"s":""})</dd></div>
          <div><dt>Seuil de rentabilité</dt><dd>${seuilTxt}</dd></div>
        </dl>
        ${F.seuil ? `<div style="margin-top:12px"><div class="bar" style="height:10px"><i style="width:${seuilPct}%;background:${F.nEff>=F.seuil?"var(--good)":"var(--warn)"}"></i></div><p class="hint" style="margin-top:6px">${F.nEff >= F.seuil ? `Seuil atteint : ${F.nEff - F.seuil} séance${F.nEff-F.seuil>1?"s":""} au-delà.` : `Il manque ${F.seuil - F.nEff} séance${F.seuil-F.nEff>1?"s":""} pour couvrir les charges fixes et l'amortissement.`}</p></div>` : ""}
        <p class="note">Seuil = charges de structure (${fmtDH(F.structure)} : fixes, amortissements, dépenses hors consommables) ÷ marge par séance (prix moyen − consommables par séance). Chaque absence non remplacée est une séance perdue au prix moyen.</p></section>
      </div>
      <section class="box"><h3>Compte de résultat simplifié</h3><div class="tbl-wrap"><table class="pl"><tbody>
        <tr class="sec"><td colspan="2">Produits</td></tr>
        <tr><td class="ind">Honoraires des séances effectuées (${F.nEff})</td><td class="num">${fmtDH(F.ca)}</td></tr>
        <tr class="sec"><td colspan="2">Charges d'exploitation</td></tr>
        ${cats || `<tr><td class="ind muted">Aucune charge saisie</td><td class="num">0 DH</td></tr>`}
        <tr><td class="ind">Dotations aux amortissements</td><td class="num">${fmtDH(F.totAmort)}</td></tr>
        <tr class="tot"><td>Total des charges</td><td class="num">${fmtDH(F.charges)}</td></tr>
        <tr class="res"><td>Résultat avant impôt</td><td class="num">${fmtSigned(F.resultat)}</td></tr>
        <tr><td class="ind">${F.taux ? `Provision impôt (${F.taux} %)` : "Provision impôt : taux non renseigné"}</td><td class="num">${F.taux ? "−" + fmtDH(F.impot) : "—"}</td></tr>
        ${F.taux ? `<tr class="tot"><td>Résultat net estimé</td><td class="num">${fmtSigned(F.net)}</td></tr>` : ""}

function readSettings(){

  const fixes = rows('[data-row="fixe"]', ["libelle","categorie","montant","depuis","fin"]).filter(x => x.libelle || x.montant).map(x => Object.assign(x, {montant:+x.montant||0}));

    nom:v("sNom").trim() || DEFAULTS.nom, praticien:v("sPrat").trim(),

/* ================= Tiroir (formulaires) ================= */
function openDrawer(type, html, data){
  S.drawer = Object.assign({type}, data||{});
  $("#sheet").innerHTML = html; $("#drawer").hidden = false;
  document.body.style.overflow = "hidden";
  setTimeout(() => { const el = $("#sheet input:not([type=hidden]):not([type=checkbox]), #sheet select, #sheet textarea"); el && el.focus(); }, 30);
}
function closeDrawer(){ $("#drawer").hidden = true; $("#sheet").innerHTML = ""; S.drawer = null; document.body.style.overflow = ""; }
const dHead = (t, sub) => `<div class="dh"><div><h2 id="dTitle">${t}</h2>${sub?`<p>${sub}</p>`:""}</div><button class="btn icon-btn ghost" data-action="close" aria-label="Fermer">${ic("close")}</button></div>`;
const patientOptions = sel => [...S.patients.entries()].sort((a,b) => String(a[1].nom).localeCompare(String(b[1].nom),"fr")).map(([id,p]) => `<option value="${esc(id)}" ${id===sel?"selected":""}>${esc(p.nom)}${p.tel?" — "+esc(p.tel):""}</option>`).join("");
const motifList = `<datalist id="motifs">${MOTIFS.map(m => `<option value="${esc(m)}">`).join("")}</datalist>`;

function rdvDrawer(opts){
  const c = cfg(); const edit = !!opts.id;
  const r = edit ? Object.assign({}, S.months.get(opts.m)?.rdv.get(opts.id) || {}) : {};
  if (edit && !r.date){ toast("Ce rendez-vous n'existe plus.", true); return; }
  const pid = r.patientId || opts.patient || "";
  const p = S.patients.get(pid);
  const montant = edit ? r.montant : (p ? (p.tarif || c.tarifDefaut) : c.tarifDefaut);
  const date = r.date || opts.date || S.day; const heure = r.heure || opts.time || c.ouverture;
  const st = edit ? S.D.pstats.get(pid) : null; const n = st && st.num.get(opts.id);
  const sub = edit ? `${esc(dayLabel(r.date))} · ${esc(r.heure)}${n?` · séance ${n}${st.pres?"/"+st.pres:""}`:""}` : "";
  const reg = r.reglement ? `<div class="banner info" style="margin:0"><span>Réglée le ${esc(dayShort(r.reglement.date))} · ${esc(MODES[r.reglement.mode]||"")} · ${fmtDH(r.reglement.montant)}</span><button type="button" class="btn sm" data-action="undo-pay" data-write>Annuler le règlement</button></div>` : "";
  const html = dHead(edit ? "Rendez-vous" : "Nouveau rendez-vous", sub) + `<form id="fRdv" class="form" autocomplete="off">
    <label class="f">Patient<select id="rPat" required><option value="">Choisir un patient…</option>${patientOptions(pid)}<option value="__new">+ Nouveau patient…</option></select></label>
    <fieldset id="rNew" hidden><legend>Nouveau patient</legend><div class="form">
      <div class="g2"><label class="f">Nom complet<input id="nNom"></label><label class="f">Téléphone<input id="nTel" type="tel" placeholder="06 12 34 56 78"></label></div>
      <label class="f">Motif / pathologie<input id="nMotif" list="motifs"></label>
      <div class="g2"><label class="f">Couverture<select id="nCouv">${COUVERTURES.map(x => `<option>${esc(x)}</option>`).join("")}</select></label><label class="f">Séances prescrites<input id="nPres" type="number" min="0" step="1" value="10"></label></div></div></fieldset>
    <div class="g2"><label class="f">Date<input id="rDate" type="date" value="${esc(date)}" required></label><label class="f">Heure<input id="rHeure" type="time" step="300" value="${esc(heure)}" required></label></div>
    <div class="g3"><label class="f">Durée (min)<input id="rDuree" type="number" min="5" step="5" value="${esc(r.duree || c.dureeDefaut)}"></label>
      <label class="f">Type<select id="rType">${TYPES.map(t => `<option ${t===(r.type||"Séance")?"selected":""}>${t}</option>`).join("")}</select></label>
      <label class="f">Montant (DH)<input id="rMontant" type="number" min="0" step="1" value="${esc(montant)}"></label></div>
    <p class="hint" id="rCap"></p>
    ${edit ? `<div class="f">Statut<div class="radios">${Object.entries(STATUTS).map(([k,l]) => `<label><input type="radio" name="rSt" value="${k}" ${r.statut===k?"checked":""}>${l}</label>`).join("")}</div></div>
      <label class="f">Douleur ressentie (EVA)<select id="rEva"><option value="">Non évaluée</option>${Array.from({length:11},(_,i) => `<option value="${i}" ${r.eva!==undefined&&r.eva!==null&&r.eva!==""&&+r.eva===i?"selected":""}>${i}${i===0?" — aucune douleur":i===10?" — douleur maximale":""}</option>`).join("")}</select></label>${reg}` : ""}
    <label class="f">Note de séance<textarea id="rNote" rows="2" placeholder="Exercices, technique, observation…">${esc(r.note)}</textarea></label>
    ${edit ? "" : `<fieldset><legend><label style="display:inline-flex;gap:6px;align-items:center"><input type="checkbox" id="rRep">Planifier une série de séances</label></legend>
      <div id="rRepBox" class="form" hidden><div class="checks">${JOURS.slice(0,6).map(([d,l]) => `<label><input type="checkbox" data-rep="${d}" ${[1,3,5].includes(d)?"checked":""}>${l}</label>`).join("")}</div>
      <label class="f">Nombre de séances à créer<input id="rRepN" type="number" min="1" max="60" step="1" value="10"></label><p class="hint" id="rRepHint"></p></div></fieldset>`}
    <div class="dfoot">${edit ? `<button type="button" class="btn danger" data-action="del-rdv" data-confirm data-write>Supprimer</button>` : "<span></span>"}
      <div class="r"><button type="button" class="btn" data-action="close">Fermer</button><button type="submit" class="btn primary" data-write>${edit?"Enregistrer":"Créer"}</button></div></div>
  </form>${motifList}`;
  openDrawer("rdv", html, {id:opts.id, m:opts.m, orig:r});
  const f = $("#fRdv");
  const sync = () => {
    const ps = $("#rPat").value; $("#rNew").hidden = ps !== "__new";
    const pp = S.patients.get(ps); if (!edit && pp && !f.dataset.touchedMontant) $("#rMontant").value = pp.tarif || c.tarifDefaut;
    const d = $("#rDate").value, h = $("#rHeure").value;
    const {slots, step, open} = slotsFor(d||S.day); const postes = Math.max(1, +c.postes||1);
    let s = null; for (const x of slots){ if (toMin(x) <= toMin(h)) s = x; else break; }
    const used = s ? (S.D.byDay.get(d)||[]).filter(x => active(x) && x.id !== opts.id && toMin(x.heure) >= toMin(s) && toMin(x.heure) < toMin(s)+step).length : 0;
    const msgs = [];
    if (!open) msgs.push("Le cabinet est fermé ce jour-là.");
    else if (!s || toMin(h) >= toMin(slots[slots.length-1]||"0:0") + step) msgs.push("Heure en dehors des horaires d'ouverture.");
    if (used >= postes) msgs.push(`Créneau complet : ${used} patient${used>1?"s":""} déjà prévu${used>1?"s":""} pour ${postes} poste${postes>1?"s":""}.`);
    else if (s) msgs.push(`Créneau ${s} : ${used}/${postes} occupé${used>1?"s":""}.`);
    $("#rCap").textContent = msgs.join(" ");
    $("#rCap").style.color = (used >= postes || !open) ? "var(--bad)" : "";
    if (!edit){
      $("#rRepBox").hidden = !$("#rRep").checked;
      if ($("#rRep").checked){
        const dates = repDates(); const st2 = pp ? S.D.pstats.get(ps) : null;
        let t = dates.length ? `${dates.length} rendez-vous du ${dayShort(dates[0])} au ${dayShort(dates[dates.length-1])} à ${h}.` : "Choisis au moins un jour.";
        if (st2 && st2.pres){ const rest = st2.pres - st2.eff - st2.plan; t += rest >= 0 ? ` Il reste ${rest} séance${rest>1?"s":""} sur l'ordonnance.` : ""; if (dates.length > rest && rest >= 0) t += " Attention : la série dépasse l'ordonnance."; }
        $("#rRepHint").textContent = t;
      }
    }
  };
  f.addEventListener("input", e => { if (e.target.id === "rMontant") f.dataset.touchedMontant = "1"; sync(); });
  f.addEventListener("change", sync);
  if (!edit){ const pp = S.patients.get(pid); if (pp && pp.dateOrdonnance){ const st2 = S.D.pstats.get(pid); const rest = st2.pres ? st2.pres - st2.eff - st2.plan : 10; $("#rRepN").value = Math.max(1, Math.min(30, rest || 10)); } }
  sync();
  f.addEventListener("submit", async e => { e.preventDefault(); await saveRdv(edit); });
}
function repDates(){
  const days = $$("[data-rep]").filter(x => x.checked).map(x => +x.dataset.rep);
  const n = Math.max(1, Math.min(60, +$("#rRepN").value || 1)); const out = [];
  if (!days.length) return out;
  let d = $("#rDate").value; let guard = 0;
  while (out.length < n && guard++ < 200){ if (days.includes(parseYmd(d).getDay())) out.push(d); d = addDays(d, 1); }
  return out;
}
async function saveRdv(edit){
  const c = cfg(); const o = S.drawer;
  let pid = $("#rPat").value;
  const date = $("#rDate").value, heure = $("#rHeure").value;
  if (!date || !heure){ toast("Indique la date et l'heure.", true); return; }
  if (pid === "__new"){
    const nom = $("#nNom").value.trim(); if (!nom){ toast("Indique le nom du nouveau patient.", true); return; }
    const ref = S.db ? S.db.collection("patients").doc() : null;
    const ok = await write(() => ref.set({nom, tel:$("#nTel").value.trim(), motif:$("#nMotif").value.trim(), couverture:$("#nCouv").value,
      seancesPrescrites:+$("#nPres").value||0, dateOrdonnance:date, tarif:+$("#rMontant").value||c.tarifDefaut, prescripteur:"", feuilleSoins:false, notes:"", createdAt:new Date().toISOString()}));
    if (!ok) return; pid = ref.id;
  }
  if (!pid){ toast("Choisis un patient.", true); return; }
  const base = {patientId:pid, heure, duree:+$("#rDuree").value||c.dureeDefaut, type:$("#rType").value, montant:+$("#rMontant").value||0, note:$("#rNote").value.trim()};
  if (edit){
    const orig = o.orig; const st = ($("input[name=rSt]:checked")||{}).value || orig.statut;
    const evaV = $("#rEva").value;
    const doc = Object.assign({}, orig, base, {date, statut:st, eva: evaV === "" ? null : +evaV});
    delete doc.id; delete doc.m;
    const nm = monthOf(date);
    const ok = await write(async () => {
      if (nm === o.m) await rdvRef(o.m, o.id).set(doc);
      else { await rdvRef(nm, o.id).set(doc); await rdvRef(o.m, o.id).delete(); }
    }, "Rendez-vous enregistré");
    if (ok){ ensureMonth(nm); closeDrawer(); }
  } else {
    const dates = $("#rRep").checked ? repDates() : [date];
    if (!dates.length){ toast("Choisis au moins un jour pour la série.", true); return; }
    const btn = $('#fRdv [type=submit]'); btn.disabled = true;
    const now = new Date().toISOString();
    const tasks = dates.map(d => () => { const m = monthOf(d); ensureMonth(m); return S.db.collection(`mois/${m}/rdv`).doc().set(Object.assign({}, base, {date:d, statut:"prevu", createdAt:now})); });
    const ok = await write(() => pool(tasks, 3, k => { if (dates.length > 1) btn.textContent = `Création ${k}/${dates.length}…`; }),
      dates.length > 1 ? `${dates.length} rendez-vous créés` : "Rendez-vous créé");
    if (ok){ closeDrawer(); S.day = dates[0]; if (S.view === "agenda") schedule(); } else btn.disabled = false;
  }
}

function evaSpark(evas){
  if (evas.length < 2) return evas.length ? `<p class="hint">EVA relevée une fois : ${evas[0].eva}/10.</p>` : `<p class="hint">Aucune EVA relevée. Renseigne-la dans le rendez-vous après la séance.</p>`;
  const W = 300, H = 92, L = 22, R = 8, T = 8, B = 16; const n = evas.length;
  const x = i => L + (W-L-R) * (n === 1 ? .5 : i/(n-1)); const y = v => T + (H-T-B) * (1 - v/10);
  let g = [0,5,10].map(v => `<line class="gl" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L-5}" y="${y(v)+3}" text-anchor="end">${v}</text>`).join("");
  g += `<polyline class="ln" points="${evas.map((e,i) => `${x(i).toFixed(1)},${y(e.eva).toFixed(1)}`).join(" ")}"/>`;
  g += evas.map((e,i) => `<circle class="pt" cx="${x(i).toFixed(1)}" cy="${y(e.eva).toFixed(1)}" r="${i===n-1?4.5:3}"><title>${esc(dayShort(e.date))} : ${e.eva}/10</title></circle>`).join("");
  g += `<text class="ax" x="${L}" y="${H-2}">${esc(dayShort(evas[0].date))}</text><text class="ax" x="${W-R}" y="${H-2}" text-anchor="end">${esc(dayShort(evas[n-1].date))}</text>`;
  const d = evas[n-1].eva - evas[0].eva;
  return `<div class="spark"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution de la douleur EVA">${g}</svg></div><p class="hint">De ${evas[0].eva} à ${evas[n-1].eva}/10 sur ${n} séances (${d<=0?"−":"+"}${Math.abs(d)} point${Math.abs(d)>1?"s":""}).</p>`;
}

function armed(btn){
  if (btn.dataset.armedOn) return true;
  btn.dataset.armedOn = "1"; btn.dataset.label = btn.innerHTML; btn.classList.add("armed"); btn.textContent = "Confirmer ?";
  setTimeout(() => { if (btn.isConnected){ btn.classList.remove("armed"); btn.innerHTML = btn.dataset.label; delete btn.dataset.armedOn; } }, 4000);
  return false;
}
async function onAction(btn, e){
  const a = btn.dataset.action, ds = btn.dataset;
  if (ds.confirm !== undefined && !armed(btn)) return;
  switch (a){
    case "close": closeDrawer(); break;
    case "day": S.day = ds.day; ensureMonth(monthOf(S.day)); schedule(); break;
    case "day-shift": S.day = addDays(S.day, +ds.n); ensureMonth(monthOf(S.day)); schedule(); break;
    case "m-shift": S.month = addMonths(S.month, +ds.n); ensureMonth(S.month); schedule(); break;
    case "pfilter": S.pfilter = ds.f; $$('[data-action="pfilter"]').forEach(b => b.setAttribute("aria-pressed", b.dataset.f === S.pfilter)); schedule(); break;
    case "new-rdv":
      if (!S.patients.size && !ds.patient){ /* premier usage : patient créé dans le même formulaire */ }
      rdvDrawer({date:ds.date, time:ds.time, patient:ds.patient}); break;
    case "open-rdv": rdvDrawer({id:ds.id, m:ds.m}); break;
    case "open-patient": patientDrawer(ds.id); break;
    case "new-patient": patientDrawer(null); break;
    case "new-payment": paymentDrawer({patient:ds.patient, amount:ds.amount}); break;
    case "new-charge": chargeDrawer(); break;
    case "rdv-status": await write(() => rdvRef(ds.m, ds.id).update({statut:ds.s}), ds.s === "effectue" ? "Séance effectuée" : "Absence notée"); break;
    case "rdv-pay": payDrawer(ds.m, ds.id); break;
    case "pay-mode": {
      const o = S.drawer; const mt = +$("#pyM").value || 0; const d = $("#pyD").value || TODAY;
      $$(".paymodes .btn").forEach(b => b.disabled = true);
      const ok = await write(() => rdvRef(o.m, o.id).update({reglement:{date:d, mode:ds.mode, montant:mt}}), `${fmtDH(mt)} encaissés (${MODES[ds.mode]})`);
      if (ok) closeDrawer(); else $$(".paymodes .btn").forEach(b => b.disabled = false);
      break; }
    case "undo-pay": {
      const o = S.drawer; const cur = Object.assign({}, S.months.get(o.m)?.rdv.get(o.id) || {}); delete cur.reglement;
      const ok = await write(() => rdvRef(o.m, o.id).set(cur), "Règlement annulé");
      if (ok){ o.orig = cur; btn.closest(".banner").remove(); }
      break; }
    case "del-rdv": { const o = S.drawer; const ok = await write(() => rdvRef(o.m, o.id).delete(), "Rendez-vous supprimé"); if (ok) closeDrawer(); break; }
    case "del-payment": await write(() => S.db.collection(`mois/${ds.m}/paiements`).doc(ds.id).delete(), "Encaissement supprimé"); break;
    case "del-charge": await write(() => S.db.collection(`mois/${ds.m}/charges`).doc(ds.id).delete(), "Dépense supprimée"); break;
    case "del-patient": { const id = S.drawer.id; const ok = await write(() => S.db.collection("patients").doc(id).delete(), "Patient supprimé (ses rendez-vous restent dans l'agenda)"); if (ok) closeDrawer(); break; }
    case "new-ordo": { $("#pDO").value = TODAY; $("#pFS").checked = false; $("#pPres").focus(); $("#pPres").select(); toast("Indique le nombre de séances de la nouvelle ordonnance puis enregistre."); break; }
    case "row-add": { const box = ds.kind === "fixe" ? $("#rowsFixe") : $("#rowsMat"); box.insertAdjacentHTML("beforeend", ds.kind === "fixe" ? fixeRow() : matRow()); S.settingsDirty = true; dirtyNote(); $("input", box.lastElementChild).focus(); break; }
    case "row-del": btn.closest(".frow").remove(); S.settingsDirty = true; dirtyNote(); break;
    case "clear-examples": await clearExamples(btn); break;
    case "export": exportData(); break;
    case "import-cancel": S.pendingImport = null; S.shellKey = ""; schedule(); break;
    case "import-confirm": {
      const pi = S.pendingImport; if (!pi) break;
      btn.disabled = true;
      const ok = await write(() => importToCloud(pi.data, (k, n) => { btn.textContent = `Import ${k}/${n}…`; }), `Données importées : ${pi.nPat} patients, ${pi.nRdv} rendez-vous`, true);
      if (ok) S.pendingImport = null;
      S.shellKey = ""; schedule(); break; }
    case "legacy-send": {
      const lg = S.legacy; if (!lg) break;
      btn.disabled = true;
      const ok = await write(() => importToCloud(lg.data, (k, n) => { btn.textContent = `Envoi ${k}/${n}…`; }), `${lg.nPat} patients et ${lg.nRdv} rendez-vous envoyés dans la base en ligne`, true);
      if (ok){ legacyDone("envoye"); S.shellKey = ""; } else btn.disabled = false;
      schedule(); break; }
    case "legacy-skip": legacyDone("ignore"); schedule(); break;
    case "logout": await logout(); break;
    case "gate-step": showGate(ds.step); break;
    case "gate-verified": await gateVerified(btn); break;
    case "gate-resend": await gateResend(btn); break;
    case "reload": location.reload(); break;
  }
}
