<style>
/* Page publique de réservation : mêmes couleurs que la carte de visite et l'application du cabinet.
   Les patients ne voient que des créneaux libres ou occupés, jamais de noms. */
:root{
  --bg:#F4F6F9; --surface:#FFFFFF; --sunken:#EDF1F5; --ink:#1B2F4E; --ink-2:#3B4F6E; --muted:#5F6E85;
  --line:#DAE1E9; --line-strong:#B9C4D2;
  --accent:#13826D; --accent-ink:#0D6858; --accent-soft:#DCF1EA; --on-accent:#FFFFFF;
  --tape:#A8368B; --tape-soft:#F8E4F2; --logo-blue:#2F4F91; --bad:#B3352E; --bad-soft:#F8E1DF;
  --shadow:0 1px 2px rgba(27,47,78,.06),0 12px 32px rgba(27,47,78,.12);
  --f-display:"Roboto Condensed","Arial Narrow","Segoe UI",system-ui,sans-serif;
  --f-body:"Public Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --f-ar:"Noto Kufi Arabic","Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1522; --surface:#132033; --sunken:#0F1A2A; --ink:#E3E9F2; --ink-2:#B3BFD1; --muted:#8492A8;
  --line:#22314A; --line-strong:#33445F;
  --accent:#45C2A8; --accent-ink:#7DD6C3; --accent-soft:#103A36; --on-accent:#03241E;
  --tape:#E57CC8; --tape-soft:#3A1733; --logo-blue:#7F9BDB; --bad:#F07D74; --bad-soft:#3C1A17;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.45);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0C1522; --surface:#132033; --sunken:#0F1A2A; --ink:#E3E9F2; --ink-2:#B3BFD1; --muted:#8492A8;
  --line:#22314A; --line-strong:#33445F;
  --accent:#45C2A8; --accent-ink:#7DD6C3; --accent-soft:#103A36; --on-accent:#03241E;
  --tape:#E57CC8; --tape-soft:#3A1733; --logo-blue:#7F9BDB; --bad:#F07D74; --bad-soft:#3C1A17;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:680px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.head{border-top:3px solid var(--tape);display:flex;flex-direction:column;gap:8px}
.brand-row{display:flex;gap:10px;align-items:center}
.brand-row svg{width:48px;height:48px;flex:none}
.brand-row small{display:block;font-family:var(--f-display);font-weight:700;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--accent-ink)}
.brand-row b{display:block;font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.05;text-transform:uppercase;color:var(--tape)}

.head .ar{font-size:12.5px;color:var(--accent-ink);padding-top:8px;border-top:1px solid var(--tape)}
.head .ar b{color:var(--tape)}

h1 .ar{font-size:18px;color:var(--tape)}
.lead{margin:6px 0 0;color:var(--ink-2)}
.step{font-family:var(--f-display);font-weight:700;font-size:19px;margin:0 0 10px;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.step small{font-family:var(--f-body);font-weight:500;font-size:14px;color:var(--muted)}
.hint{color:var(--muted);font-size:13.5px;margin:0}
.center{text-align:center}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.cal-head b{font-family:var(--f-display);font-weight:700;font-size:20px}
.mo{width:42px;height:42px;border-radius:12px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font-size:24px;line-height:1;cursor:pointer}
.mo:hover{border-color:var(--accent);color:var(--accent-ink)}
.mo:disabled{opacity:.3;cursor:default}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wh{text-align:center;font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding-bottom:2px}
.cd{height:58px;border-radius:12px;border:1px solid transparent;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:2px;font:inherit}
.cd .dn{font-family:var(--f-display);font-weight:700;font-size:19px;line-height:1}
.cd .fr{font-size:10.5px;font-weight:600;line-height:1.1;white-space:nowrap}
.cd.ok{border-color:color-mix(in srgb,var(--accent) 55%,transparent);background:var(--surface);color:var(--accent-ink);cursor:pointer}
.cd.ok:hover{background:var(--accent-soft)}
.cd.full{background:var(--sunken)}
.cd.full .dn{text-decoration:line-through}
.cd.closed{background:repeating-linear-gradient(135deg,var(--sunken) 0 5px,transparent 5px 10px);opacity:.7}
.cd.out{opacity:.45}
.cd.pad{visibility:hidden}
.cd.today .dn{color:var(--tape)}
.cd[aria-pressed="true"]{background:linear-gradient(160deg,#13826D,#0D6858);border-color:transparent;color:#fff;box-shadow:0 6px 14px rgba(19,130,109,.3)}
.cd[aria-pressed="true"] .dn{color:#fff}
.hint-card{border-style:dashed;text-align:center}
@media (max-width:440px){ .cal-grid{gap:4px} .cd{height:48px;border-radius:10px} .cd .dn{font-size:16px} .cd .fr .w{display:none} }
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.slot{border:1.5px solid var(--accent);background:var(--surface);color:var(--accent-ink);border-radius:10px;padding:8px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;min-height:56px;justify-content:center}
.slot b{font-family:var(--f-mono);font-size:16px;font-weight:500}
.slot small{font-size:11.5px;font-weight:600}
.slot:hover{background:var(--accent-soft)}
.slot[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.slot:disabled{border-color:var(--line);background:var(--sunken);color:var(--muted);cursor:not-allowed}
.slot:disabled b{text-decoration:line-through}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px;border:1.5px solid var(--accent)}
.legend i.x{border-color:var(--line);background:var(--sunken)}
.legend i.ferme{border-color:var(--line);background:repeating-linear-gradient(135deg,var(--line) 0 3px,transparent 3px 6px)}
.form{display:flex;flex-direction:column;gap:12px}
.sum{margin:0;padding:10px 12px;border-radius:10px;background:var(--accent-soft);color:var(--accent-ink)}
.f{display:flex;flex-direction:column;gap:4px;font-size:13.5px;font-weight:600;color:var(--ink-2)}
input[type=text],input[type=tel]{border:1px solid var(--line-strong);background:var(--surface);border-radius:9px;padding:10px 12px;font-size:16px;min-height:44px;width:100%}
.okbox{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--ink-2)}
.okbox input{margin-top:3px;width:18px;height:18px;accent-color:var(--accent);flex:none}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);padding:10px 16px;border-radius:10px;font-weight:600;cursor:pointer;min-height:44px;text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-size:16px;min-height:50px}
.btn:disabled{opacity:.6;cursor:default}
.err{color:var(--bad);background:var(--bad-soft);border-radius:9px;padding:10px 12px;margin:0;font-weight:600;font-size:14px}
.done{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;border-top:3px solid var(--accent)}
.done .tick{width:56px;height:56px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.done .tick svg{width:30px;height:30px}
.done h2{font-family:var(--f-display);font-size:24px;margin:0}
.done .when{font-family:var(--f-display);font-weight:700;font-size:21px;color:var(--accent-ink);margin:0}
.done p{margin:0}
.contact{display:flex;flex-direction:column;gap:12px;font-size:14px;color:var(--ink-2)}
.contact a{color:var(--accent-ink);text-decoration:none}
.cbtns{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.cbtn{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);background:var(--accent-soft);min-height:52px}
.cbtn svg{width:22px;height:22px;flex:none}
.cbtn span{display:flex;flex-direction:column;line-height:1.2}
.cbtn b{font-family:var(--f-mono);font-weight:500;font-size:15px;color:var(--ink)}
.cbtn small{font-size:12px;font-weight:600}
.cbtn.wa{background:color-mix(in srgb,#25D366 14%,var(--surface));border-color:color-mix(in srgb,#25D366 45%,transparent);color:color-mix(in srgb,#1FA855 75%,var(--ink))}
.cbtn.wa b{font-family:var(--f-body);font-weight:700}
.cbtn:hover,.addr:hover{filter:brightness(.97)}
.addr{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2)}
.addr svg{width:22px;height:22px;flex:none;color:var(--tape);margin-top:1px}
.addr span{display:flex;flex-direction:column;gap:4px}
.addr b{color:var(--accent-ink);font-size:14px}
.waze{font-size:13px;font-weight:600;align-self:flex-start}
.waze:hover{text-decoration:underline}
@media (prefers-reduced-motion:no-preference){ .slot,.cd{transition:background-color .15s,border-color .15s} }
</style>
</head>

<main class="wrap">

  </div>

</main>
<script>
"use strict";
// Même projet Firebase que l'application du cabinet. Ces clés sont publiques par nature : l'accès est contrôlé
// par firestore.rules (lecture des créneaux seulement ; une demande n'est acceptée que sur un créneau libre).
const FIREBASE_CONFIG = {
  apiKey:"AIzaSyC5jTvvTllfAo_K9uaFR_Ckg1OK8DJN9YA", authDomain:"cabinet-sebti-assia.web.app", projectId:"cabinet-sebti-assia",
  storageBucket:"cabinet-sebti-assia.firebasestorage.app", messagingSenderId:"255493261882", appId:"1:255493261882:web:aba15d530ecad769b38303"
};
const SDK = ["app","firestore"].map(m => `https://www.gstatic.com/firebasejs/10.14.1/firebase-${m}-compat.js`);

const $ = (s, r=document) => r.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y,m,d] = String(s).split("-").map(Number); return new Date(y, (m||1)-1, d||1); };
const addDays = (s,n) => { const d = parseYmd(s); d.setDate(d.getDate()+n); return ymd(d); };
const toMin = t => { const [h,m] = String(t||"0:0").split(":").map(Number); return (h||0)*60+(m||0); };
const fromMin = n => `${pad(Math.floor(n/60))}:${pad(n%60)}`;
const cap = s => s ? s.charAt(0).toUpperCase()+s.slice(1) : s;
const dayLong = s => cap(parseYmd(s).toLocaleDateString("fr-FR",{weekday:"long", day:"numeric", month:"long"}));
const TODAY = ymd(new Date());
const loadScript = src => new Promise((ok, ko) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = () => ko(new Error(src)); document.head.appendChild(s); });

const P = {db:null, ag:undefined, occ:new Map(), month:null, day:null, slot:null, done:null, sending:false, msg:"", err:"", subbed:false,
  ready:{ag:false, occ:false}};

function slotsFor(day){
  const a = P.ag, dow = parseYmd(day).getDay();
  const open = (a.joursOuvres || []).map(Number).includes(dow);
  const end = (dow === 6 && a.samediFermeture) ? a.samediFermeture : a.fermeture;
  const step = Math.max(10, +a.pas || 30), out = [];
  for (let t = toMin(a.ouverture); t < toMin(end); t += step) out.push(fromMin(t));
  return {open, slots:out, step};
}
// occupé : un rendez-vous confirmé par le cabinet touche ce créneau. Une simple demande ne le bloque pas :
// le créneau ne se ferme qu'à la confirmation du cabinet.
const taken = (d, s) => ((P.occ.get(d) || {})[s] || 0) > 0;
const tooSoon = (d, s) => { const [y,m,j] = d.split("-").map(Number), [h,mi] = s.split(":").map(Number);
  return new Date(y, m-1, j, h, mi).getTime() < Date.now() + (+P.ag.delaiH || 0) * 3600e3; };
// Calendrier du mois : un jour est réservable s'il est dans la période ouverte, que le cabinet travaille
// et qu'il reste au moins un créneau libre (ni confirmé pour un autre patient, ni trop proche).
const lastDay = () => addDays(TODAY, +P.ag.horizon || 21);
function dayInfo(d){
  if (d < TODAY || d > lastDay()) return {inRange:false};
  const {open, slots} = slotsFor(d);
  if (!open) return {inRange:true, open:false};
  const visible = slots.filter(s => !tooSoon(d, s));
  if (!visible.length) return {inRange:false}; // aujourd'hui, après la dernière heure réservable
  return {inRange:true, open:true, free:visible.filter(s => !taken(d, s)).length};
}
const nextMonth = m => { let [y, mo] = m.split("-").map(Number); if (++mo > 12){ mo = 1; y++; } return `${y}-${pad(mo)}`; };
function monthsInRange(){ const out = []; for (let m = TODAY.slice(0, 7); m <= lastDay().slice(0, 7); m = nextMonth(m)) out.push(m); return out; }
function calendar(){
  const months = monthsInRange(), i = months.indexOf(P.month);
  const d0 = parseYmd(P.month + "-01"), lead = (d0.getDay() + 6) % 7; // semaine du lundi au dimanche
  const nDays = new Date(d0.getFullYear(), d0.getMonth() + 1, 0).getDate();
  let cells = "";
  for (let k = 0; k < lead; k++) cells += `<span class="cd pad" aria-hidden="true"></span>`;
  for (let j = 1; j <= nDays; j++){
    const d = `${P.month}-${pad(j)}`, inf = dayInfo(d);
    const cls = !inf.inRange ? "out" : !inf.open ? "closed" : inf.free ? "ok" : "full";
    const etat = cls === "ok" ? `${inf.free} créneau${inf.free > 1 ? "x" : ""} libre${inf.free > 1 ? "s" : ""}` : cls === "full" ? "complet" : cls === "closed" ? "cabinet fermé" : "non réservable";
    cells += `<button type="button" class="cd ${cls} ${d === TODAY ? "today" : ""}" data-day="${d}" aria-pressed="${d === P.day}" ${cls === "ok" ? "" : "disabled"} aria-label="${esc(dayLong(d))} : ${etat}">
      <span class="dn">${j}</span>${cls === "ok" ? `<span class="fr">${inf.free}<span class="w"> libre${inf.free > 1 ? "s" : ""}</span></span>` : cls === "full" ? `<span class="fr">complet</span>` : ""}</button>`;
  }
  return `<div class="cal-head"><button type="button" class="mo" data-mo="-1" ${i <= 0 ? "disabled" : ""} aria-label="Mois précédent">‹</button>
      <b>${esc(cap(d0.toLocaleDateString("fr-FR", {month:"long", year:"numeric"})))}</b>
      <button type="button" class="mo" data-mo="1" ${i >= months.length - 1 ? "disabled" : ""} aria-label="Mois suivant">›</button></div>
    <div class="cal-grid">${["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"].map(w => `<span class="wh">${w}</span>`).join("")}${cells}</div>
    <div class="legend"><span><i></i>Créneaux libres</span><span><i class="x"></i>Complet</span><span><i class="ferme"></i>Fermé ou non réservable</span></div>`;
}

const TICK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
// Contact : un toucher sur un numéro appelle le cabinet, un toucher sur l'adresse ouvre l'itinéraire
const SVG = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const I_TEL = SVG('<path d="M6.5 4h3l1.5 4-2 1.3a10 10 0 0 0 5.7 5.7l1.3-2 4 1.5v3a2 2 0 0 1-2.2 2A16 16 0 0 1 4.5 6.2 2 2 0 0 1 6.5 4z"/>');
const I_MOB = SVG('<rect x="7" y="2.5" width="10" height="19" rx="2"/><path d="M11 18.5h2"/>');
const I_WA = SVG('<path d="M4 19.5l1.4-4A7.8 7.8 0 1 1 8.6 19z"/>');
const I_PIN = SVG('<path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0C18.5 15.4 12 21 12 21z"/><circle cx="12" cy="10" r="2.4"/>');
function renderContact(){
  const a = P.ag, el = $("#contact"); if (!a){ el.hidden = true; return; }
  const tel = (n, icon) => n ? `<a class="cbtn" href="tel:${esc(n.replace(/[^\d+]/g, ""))}">${icon}<span><b>${esc(n)}</b><small>Appeler</small></span></a>` : "";
  const btns = tel(a.telFixe, I_TEL) + tel(a.telMobile, I_MOB) + (a.wa ? `<a class="cbtn wa" href="https://wa.me/${esc(a.wa)}" target="_blank" rel="noopener">${I_WA}<span><b>WhatsApp</b><small>Écrire un message</small></span></a>` : "");
  const route = a.maps || (a.adresse ? `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(a.adresse + ", Maroc")}` : "");
  el.innerHTML = `<b>Une question ? Contactez le cabinet</b>${btns ? `<div class="cbtns">${btns}</div>` : ""}
    ${a.adresse ? `<a class="addr" href="${esc(route)}" target="_blank" rel="noopener">${I_PIN}<span>${esc(a.adresse)}<b>Itinéraire avec Google Maps →</b></span></a>
      <a class="waze" href="https://waze.com/ul?q=${encodeURIComponent(a.adresse + ", Maroc")}&navigate=yes" target="_blank" rel="noopener">Ou ouvrir l'itinéraire dans Waze</a>` : ""}`;
  el.hidden = !btns && !a.adresse;
}
function render(){
  // les créneaux se mettent à jour en direct : on garde ce que le patient a déjà tapé
  const keep = {}; ["fNom","fTel","fMotif"].forEach(id => { const el = $("#"+id); if (el) keep[id] = el.value; });
  const okc = $("#fOk") ? $("#fOk").checked : false, act = document.activeElement, focusId = act && act.id, sel = act && act.selectionStart;
  const app = $("#app");
  renderContact();
  if (P.err){ app.innerHTML = `<p class="err">${esc(P.err)}</p>`; return; }
  if (!P.ready.ag){ app.innerHTML = `<p class="hint center">Chargement des créneaux…</p>`; return; }
  if (!P.ag || !P.ag.actif){ app.innerHTML = `<div class="card"><p><b>La réservation en ligne n'est pas ouverte pour le moment.</b></p><p class="hint">Appelez le cabinet pour prendre rendez-vous.</p></div>`; return; }
  if (P.done){
    app.innerHTML = `<div class="card done"><div class="tick">${TICK}</div><h2>Demande envoyée</h2>
      <p class="when">${esc(dayLong(P.done.date))} à ${esc(P.done.heure)}</p>
      <p>Le cabinet va vous contacter par téléphone ou WhatsApp pour <b>confirmer</b> ce rendez-vous. Il n'est réservé qu'après cette confirmation.</p>
      <p class="ar" lang="ar" dir="rtl">تم إرسال طلبك، ستتصل بك العيادة لتأكيد الموعد.</p>
      <button class="btn" data-act="again">Demander un autre créneau</button></div>`;
    return;
  }
  if (!P.ready.occ){ app.innerHTML = `<p class="hint center">Chargement des créneaux…</p>`; return; }
  const libres = [];
  for (let i = 0; i <= (+P.ag.horizon || 21); i++){ const d = addDays(TODAY, i); if (dayInfo(d).free) libres.push(d); }
  if (!libres.length){ app.innerHTML = `<div class="card"><p><b>Aucun créneau libre dans les ${esc(P.ag.horizon)} prochains jours.</b></p><p class="hint">Appelez le cabinet : nous trouverons un moment ensemble.</p></div>`; return; }
  if (!monthsInRange().includes(P.month)) P.month = libres[0].slice(0, 7); // on ouvre sur le premier mois qui a de la place
  if (P.day && !dayInfo(P.day).inRange){ P.day = null; P.slot = null; }
  if (P.slot && !P.sending && (taken(P.day, P.slot) || tooSoon(P.day, P.slot))){ P.slot = null; P.msg = "Ce créneau vient d'être confirmé pour un autre patient : choisissez-en un autre."; }
  const cal = `<section class="card"><h2 class="step">1. Choisissez un jour</h2>${calendar()}</section>`;
  if (!P.day){ app.innerHTML = cal + `<section class="card hint-card" id="hours"><p class="hint">Touchez un jour du calendrier : les heures libres de ce jour s'afficheront ici.</p></section>`; return; }
  const {slots, step} = slotsFor(P.day);
  const shown = slots.filter(s => !tooSoon(P.day, s));
  app.innerHTML = `${cal}
    <section class="card" id="hours"><h2 class="step">2. Choisissez l'heure <small>${esc(dayLong(P.day))} · séance de ${step} min</small></h2>
      ${P.msg && !P.slot ? `<p class="err" role="alert" style="margin-bottom:10px">${esc(P.msg)}</p>` : ""}
      <div class="slots">${shown.map(s => { const t = taken(P.day, s);
        return `<button class="slot" data-slot="${s}" aria-pressed="${s === P.slot}" ${t ? "disabled" : ""} aria-label="${s}, ${t ? "occupé" : "libre"}"><b>${s}</b><small>${t ? "Occupé" : "Libre"}</small></button>`; }).join("")}</div>
      <div class="legend"><span><i></i>Libre</span><span><i class="x"></i>Occupé : déjà confirmé pour un autre patient</span></div></section>
    ${P.slot ? `<section class="card"><h2 class="step">3. Vos coordonnées</h2>
      <form id="fResa" class="form" novalidate>
        <p class="sum">Rendez-vous <b>${esc(dayLong(P.day))} à ${esc(P.slot)}</b></p>
        <label class="f">Nom et prénom<input id="fNom" type="text" autocomplete="name" maxlength="80"></label>
        <label class="f">Téléphone (WhatsApp)<input id="fTel" type="tel" autocomplete="tel" inputmode="tel" maxlength="20" placeholder="06 12 34 56 78"></label>
        <label class="f">Motif (facultatif)<input id="fMotif" type="text" maxlength="200" placeholder="Ex. douleur au dos, rééducation du genou…"></label>
        <input id="fSite" class="hp" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
        <label class="okbox"><input type="checkbox" id="fOk">J'accepte que le cabinet utilise ces informations uniquement pour gérer mon rendez-vous.</label>
        ${P.msg ? `<p class="err" role="alert">${esc(P.msg)}</p>` : ""}
        <p class="hint">Le cabinet vous confirmera le rendez-vous par téléphone ou WhatsApp.</p>
        <button class="btn primary" type="submit" ${P.sending ? "disabled" : ""}>${P.sending ? "Envoi…" : "Envoyer la demande"}</button>
      </form></section>` : ""}`;
  for (const [id, v] of Object.entries(keep)){ const el = $("#"+id); if (el) el.value = v; }
  if ($("#fOk")) $("#fOk").checked = okc;
  if (focusId && $("#"+focusId)){ const el = $("#"+focusId); el.focus(); if (typeof sel === "number" && el.setSelectionRange) try { el.setSelectionRange(sel, sel); } catch(e){} }
}

async function submit(){
  const nom = $("#fNom").value.trim(), tel = $("#fTel").value.trim(), motif = $("#fMotif").value.trim();
  const fail = m => { P.msg = m; render(); };
  if ($("#fSite").value){ P.done = {date:P.day, heure:P.slot}; return render(); } // champ piège rempli : robot
  if (nom.length < 2) return fail("Indiquez votre nom et prénom.");
  if (!/^[0-9 +.()-]{8,20}$/.test(tel) || tel.replace(/\D/g, "").length < 9) return fail("Indiquez un numéro de téléphone valide.");
  if (!$("#fOk").checked) return fail("Cochez la case d'accord pour continuer.");
  const day = P.day, slot = P.slot;
  P.sending = true; P.msg = ""; render();
  // une simple demande : les règles la refusent si le créneau est déjà confirmé pour quelqu'un d'autre
  const req = P.db.collection("demandes").add({nom, tel, motif, date:day, heure:slot, creeLe:firebase.firestore.FieldValue.serverTimestamp()});
  try {
    await Promise.race([req, new Promise((_, ko) => setTimeout(() => ko({code:"timeout"}), 20000))]);
    P.done = {date:day, heure:slot}; P.slot = null;
  } catch(e){
    console.error(e);
    if (e.code === "permission-denied"){ P.slot = null; P.msg = "Ce créneau n'est plus disponible : il vient d'être confirmé pour un autre patient. Choisissez-en un autre."; }
    else P.msg = e.code === "timeout" ? "La connexion est trop lente : vérifiez internet puis réessayez." : "La demande n'a pas abouti. Réessayez ou appelez le cabinet.";
  }
  P.sending = false; render();
  window.scrollTo({top:0, behavior:"smooth"});
}

document.addEventListener("click", e => {
  const d = e.target.closest("[data-day]"), s = e.target.closest("[data-slot]"), a = e.target.closest("[data-act]");
  const mo = e.target.closest("[data-mo]");
  if (mo && !mo.disabled){ const ms = monthsInRange(), i = ms.indexOf(P.month) + +mo.dataset.mo; if (ms[i]){ P.month = ms[i]; render(); } }
  else if (d && !d.disabled){ P.day = d.dataset.day; P.slot = null; P.msg = ""; render(); const h = $("#hours"); if (h) h.scrollIntoView({behavior:"smooth", block:"start"}); }
  else if (s && !s.disabled){ P.slot = s.dataset.slot; P.msg = ""; render(); const f = $("#fResa"); if (f) f.scrollIntoView({behavior:"smooth", block:"start"}); }
  else if (a && a.dataset.act === "again"){ P.done = null; P.msg = ""; render(); }
});
document.addEventListener("submit", e => { if (e.target.id === "fResa"){ e.preventDefault(); if (!P.sending) submit(); } });
setInterval(render, 60000); // les créneaux trop proches disparaissent au fil de la journée

(async function init(){
  try { for (const src of SDK) await loadScript(src); }
  catch(e){ P.err = "Impossible de charger la page. Vérifiez la connexion internet puis rechargez."; return render(); }
  firebase.initializeApp(FIREBASE_CONFIG);
  P.db = firebase.firestore();
  const fail = e => { console.error(e); P.err = "Impossible de charger les créneaux. Vérifiez la connexion internet puis rechargez la page."; render(); };
  P.db.doc("public/agenda").onSnapshot(snap => {
    P.ag = snap.exists ? snap.data() : null; P.ready.ag = true;
    if (P.ag && !P.subbed){
      P.subbed = true; const end = addDays(TODAY, +P.ag.horizon || 21);
      P.db.collection("occupation").where("date", ">=", TODAY).where("date", "<=", end).onSnapshot(s => {
        P.occ = new Map(s.docs.map(d => [d.id, (d.data() || {}).creneaux || {}])); P.ready.occ = true; render(); }, fail);
    }
    render();
  }, fail);
})();
</script>
</body>
